<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تدريب طلاقة القراءة</title>
<script data-goatcounter="https://rehlatwones.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}

/* Layout: sticky stopwatch strip on top, the reading page as the one big surface, progress below */
:root{
  --bg:#FBF8F1; --surface:#FFFFFF; --ink:#2A2A1C; --muted:#6B6A52; --line:#E3DECB;
  --teal:#64663A; --teal-soft:#ECEDDC; --sun:#C97735; --sun-soft:#F8E7D6;
  --err:#B4452F; --err-soft:#F7E0DA; --ok:#3B7A4C;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-read:"Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;
  --f-ui:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1B13; --surface:#24251B; --ink:#EEEBDC; --muted:#AAA88E; --line:#393A2B;
  --teal:#AEB274; --teal-soft:#31331F; --sun:#E4975E; --sun-soft:#3D2A1A;
  --err:#EE8B76; --err-soft:#3D221C; --ok:#80C492; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1B13; --surface:#24251B; --ink:#EEEBDC; --muted:#AAA88E; --line:#393A2B;
  --teal:#AEB274; --teal-soft:#31331F; --sun:#E4975E; --sun-soft:#3D2A1A;
  --err:#EE8B76; --err-soft:#3D221C; --ok:#80C492; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:1.6rem;color:var(--teal)}
h2{font-size:1.15rem}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.student{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.student select,.field{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--surface);font-weight:600}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.small{padding:4px 9px;font-size:.85rem}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.lv{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-weight:500}
.lv[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.texts{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tcard{flex:0 0 auto;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;gap:2px}
.tcard b{font-family:var(--f-read);font-weight:600;font-size:1rem}
.tcard span{color:var(--muted);font-size:.8rem}
.tcard[aria-pressed="true"]{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);background:var(--teal-soft)}
.watch{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.clock{font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-size:2.3rem;font-weight:600;line-height:1;min-width:5ch;color:var(--ink)}
.watch.running .clock{color:var(--teal)}
.watch.pick .clock{color:var(--sun)}
.go{font-size:1.05rem;padding:10px 22px;border-radius:12px}
.hint{flex:1 1 200px;color:var(--muted);font-size:.9rem;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--surface)}
.chk{display:inline-flex;gap:6px;align-items:center}
.page{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px clamp(14px,4vw,34px) 26px}
.page h2{font-family:var(--f-read);font-size:1.4rem;margin-bottom:12px;color:var(--teal)}
.reading{font-family:var(--f-read);line-height:2.3;word-spacing:.08em}
.w{display:inline;padding:1px 3px;border-radius:6px;cursor:pointer;transition:background .15s}
.w:hover{background:var(--teal-soft)}
.w.err{background:var(--err-soft);color:var(--err);text-decoration:underline wavy var(--err);text-underline-offset:6px}
.w.unread{opacity:.32}
.w.last{background:var(--sun-soft);box-shadow:0 0 0 2px var(--sun)}
.sep{color:var(--sun);font-weight:600;padding:0 .3em}
.nochunks .sep{display:none}
.result{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat span{color:var(--muted);font-size:.8rem}
.stat b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat.main{background:var(--teal-soft);border-color:var(--teal)}
.stat.main b{color:var(--teal)}
.cmp{margin:0;font-weight:500}
.cmp.up{color:var(--ok)} .cmp.down{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.progress{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:300px;height:auto}
.empty{color:var(--muted);margin:0}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500}
td.k{color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);font-size:1rem;padding:2px 6px}
details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
.form{display:flex;flex-direction:column;gap:8px;margin-top:10px}
textarea.field{min-height:110px;font-family:var(--f-read);font-size:1.05rem;line-height:1.9}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--teal);font-weight:500;text-decoration:none;align-self:flex-start}
.back:hover{background:var(--teal-soft)}
.tracks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.trk{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;text-align:right;display:flex;flex-direction:column;gap:2px;font-weight:600;min-width:0}
.trk span{font-weight:400;color:var(--muted);font-size:.82rem}
.trk[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal)}
.taskbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.w.tgt{background:var(--sun-soft);border-bottom:2px dotted var(--sun);border-radius:6px 6px 0 0}
.w.tgt.set{background:var(--teal-soft);border-bottom:2px solid var(--teal)}
.w.tgt.ok{background:transparent;color:var(--ok);border-bottom:2px solid var(--ok)}
.w.tgt.bad{background:var(--err-soft);color:var(--err);border-bottom:2px solid var(--err)}
.irpanel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.row.between{justify-content:space-between}
.score{font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--teal)}
.irnote{margin:0;padding:8px 12px;border-radius:10px;background:var(--bg);font-family:var(--f-read);font-size:1.05rem}
.picker{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(4,auto);gap:6px;box-shadow:0 10px 28px rgba(0,0,0,.2)}
.picker button{font-family:var(--f-read);font-size:1.7rem;line-height:1.5;min-width:58px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:2px 6px;color:var(--ink)}
.picker button small{display:block;font-family:var(--f-ui);font-size:.66rem;line-height:1.2;color:var(--muted)}
.picker button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.picker .clr{font-family:var(--f-ui);font-size:1rem}
.credit{text-align:center;color:var(--muted);font-size:.78rem;margin-top:4px}
.note{font-size:.85rem;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" dir="rtl" lang="ar">
  <a class="back" href="./">→ الرئيسية</a>
  <header class="top">
    <div>
      <h1>تدريب طلاقة القراءة</h1>
      <p class="sub">اقرأ النص، وسجّل الوقت، واضغط على أي كلمة فيها خطأ.</p>
    </div>
    <div class="student" id="studentBox"></div>
  </header>

  <div class="tracks" role="group" aria-label="المسار">
    <button class="trk" data-t="basic" aria-pressed="true">المسار الأساسي<span>نصوص بالتشكيل · ١٠ مستويات</span></button>
    <button class="trk" data-t="adv" aria-pressed="false">الطلاقة المتقدمة<span>نصوص بدون تشكيل · ١٠ مستويات</span></button>
  </div>
  <nav class="levels" id="levels" aria-label="المستويات"></nav>
  <div class="texts" id="texts"></div>
  <div class="taskbar" id="taskBar" hidden>
    <div class="seg" role="group" aria-label="نوع التدريب">
      <button id="tRead" aria-pressed="true">قراءة وتوقيت</button>
      <button id="tIrab" aria-pressed="false">ضبط أواخر الكلمات</button>
    </div>
  </div>

  <section class="watch" id="watch" aria-live="polite">
    <div class="clock" id="clock">٠٠:٠٠</div>
    <button class="btn primary go" id="goBtn">ابدأ</button>
    <button class="btn" id="resetBtn">إعادة</button>
    <p class="hint" id="hint"></p>
  </section>

  <div class="opts">
    <div class="seg" id="measure" role="group" aria-label="طريقة القياس">
      <button id="mFull" aria-pressed="true">النص كامل</button>
      <button id="mMin" aria-pressed="false">دقيقة واحدة</button>
    </div>
    <select class="field" id="kind" aria-label="نوع المحاولة">
      <option value="first">قراءة أولى</option>
      <option value="echo">بعد القراءة بالصدى</option>
      <option value="solo">قراءة مستقلة</option>
      <option value="expr">قراءة بتعبير</option>
      <option value="review">مراجعة نص قديم</option>
    </select>
    <label class="chk"><input type="checkbox" id="chunks" checked> إظهار التقطيع</label>
    <label class="chk" id="tashkLbl"><input type="checkbox" id="tashk" checked> إظهار التشكيل</label>
    <div class="seg" role="group" aria-label="حجم الخط">
      <button id="fMinus" aria-label="تصغير الخط">ا−</button>
      <button id="fPlus" aria-label="تكبير الخط">ا+</button>
    </div>
  </div>

  <section class="irpanel" id="irPanel" hidden></section>

  <article class="page" id="page">
    <h2 id="tTitle"></h2>
    <div class="reading" id="reading"></div>
  </article>

  <section class="result" id="result" hidden></section>

  <section class="progress" id="progWrap">
    <h2>التقدّم في هذا النص</h2>
    <div id="progress"></div>
  </section>

  <details id="addBox">
    <summary>إضافة نص من عندك</summary>
    <div class="form">
      <input class="field" id="cTitle" placeholder="عنوان النص">
      <select class="field" id="cLevel">
        <option value="1">المستوى ١</option><option value="2">المستوى ٢</option>
        <option value="3">المستوى ٣</option><option value="4">المستوى ٤</option>
        <option value="5">المستوى ٥</option><option value="6">المستوى ٦</option><option value="7">المستوى ٧</option><option value="8">المستوى ٨</option><option value="9">المستوى ٩</option><option value="10">المستوى ١٠</option>
      </select>
      <textarea class="field" id="cBody" placeholder="اكتب النص هنا… وافصل بين العبارات بعلامة / لو عايز تقطيع"></textarea>
      <div class="row"><button class="btn primary" id="cSave">حفظ النص</button><span class="note" id="cMsg"></span></div>
    </div>
  </details>

  <div class="picker" id="picker" hidden role="dialog" aria-label="اختر الحركة"></div>
  <p class="credit">إعداد: رحلة ونس - أ. سالمة سيد</p>
</div>

<script>
document.documentElement.lang='ar';
const KEY='wones-fluency-v1';
const BUILT=[
 {id:'t1',level:1,title:'القِطَّةُ الصَّغِيرَةُ',body:'ذَهَبَتْ مَرْيَمُ | إِلَى الحَدِيقَةِ. | رَأَتْ قِطَّةً صَغِيرَةً | تَحْتَ الشَّجَرَةِ. | كَانَتِ القِطَّةُ جَائِعَةً. | أَحْضَرَتْ مَرْيَمُ | قَلِيلًا مِنَ الحَلِيبِ. | شَرِبَتِ القِطَّةُ | وَنَامَتْ سَعِيدَةً.'},
 {id:'t2',level:1,title:'يَوْمٌ مُمْطِرٌ',body:'اسْتَيْقَظَ يُوسُفُ | فِي الصَّبَاحِ. | نَظَرَ مِنَ النَّافِذَةِ | فَرَأَى المَطَرَ. | لَبِسَ مِعْطَفَهُ | وَأَخَذَ مِظَلَّتَهُ. | مَشَى إِلَى المَدْرَسَةِ | وَهُوَ يُغَنِّي.'},
 {id:'t3',level:2,title:'فِي السُّوقِ',body:'فِي يَوْمِ الجُمُعَةِ | ذَهَبَتْ لَيْلَى مَعَ أُمِّهَا | إِلَى السُّوقِ. | كَانَ السُّوقُ مُزْدَحِمًا | وَمَلِيئًا بِالأَلْوَانِ. | اشْتَرَتِ الأُمُّ | طَمَاطِمَ حَمْرَاءَ | وَخِيَارًا أَخْضَرَ | وَبُرْتُقَالًا. | سَاعَدَتْ لَيْلَى أُمَّهَا | فِي حَمْلِ الأَكْيَاسِ. | وَفِي طَرِيقِ العَوْدَةِ | اشْتَرَتْ لَهَا الأُمُّ | كُوبًا مِنَ العَصِيرِ.'},
 {id:'t4',level:2,title:'الصَّدِيقُ الجَدِيدُ',body:'جَاءَ إِلَى فَصْلِنَا | طَالِبٌ جَدِيدٌ | اسْمُهُ آدَمُ. | كَانَ يَجْلِسُ وَحْدَهُ | وَيَبْدُو خَجُولًا. | فِي الفُسْحَةِ | دَعَاهُ عُمَرُ | لِيَلْعَبَ مَعَنَا الكُرَةَ. | ابْتَسَمَ آدَمُ | وَرَكَضَ مَعَنَا فِي المَلْعَبِ. | وَمُنْذُ ذَلِكَ اليَوْمِ | أَصْبَحَ آدَمُ | صَدِيقًا لَنَا جَمِيعًا.'},
 {id:'t5',level:3,title:'النَّحْلَةُ العَامِلَةُ',body:'تَعِيشُ النَّحْلَةُ | فِي خَلِيَّةٍ كَبِيرَةٍ | مَعَ آلَافِ النَّحَلَاتِ. | تَخْرُجُ كُلَّ صَبَاحٍ | لِتَبْحَثَ عَنِ الأَزْهَارِ. | تَجْمَعُ الرَّحِيقَ | وَتَعُودُ بِهِ إِلَى الخَلِيَّةِ | لِتَصْنَعَ مِنْهُ العَسَلَ. | وَحِينَ تَنْتَقِلُ النَّحْلَةُ | مِنْ زَهْرَةٍ إِلَى أُخْرَى | تَحْمِلُ حُبُوبَ اللِّقَاحِ | فَتُسَاعِدُ النَّبَاتَاتِ | عَلَى النُّمُوِّ. | فَالنَّحْلَةُ صَغِيرَةُ الحَجْمِ | لَكِنَّ فَائِدَتَهَا كَبِيرَةٌ.'},
 {id:'t6',level:3,title:'رِحْلَةٌ إِلَى البَحْرِ',body:'فِي الصَّيْفِ المَاضِي | سَافَرَتْ عَائِلَتِي | إِلَى مَدِينَةِ الإِسْكَنْدَرِيَّةِ. | كَانَ البَحْرُ أَزْرَقَ صَافِيًا | وَالهَوَاءُ مُنْعِشًا. | بَنَيْتُ مَعَ أَخِي | قَلْعَةً كَبِيرَةً مِنَ الرَّمْلِ | وَزَيَّنَّاهَا بِالأَصْدَافِ. | وَفِي المَسَاءِ | جَلَسْنَا عَلَى الشَّاطِئِ | نُشَاهِدُ غُرُوبَ الشَّمْسِ | وَنَأْكُلُ الذُّرَةَ المَشْوِيَّةَ. | كَانَتْ أَيَّامًا جَمِيلَةً | لَنْ أَنْسَاهَا أَبَدًا.'},
 {id:'t7',level:4,title:'المَاءُ سِرُّ الحَيَاةِ',body:'المَاءُ أَسَاسُ الحَيَاةِ عَلَى الأَرْضِ، | فَلَا يَسْتَطِيعُ الإِنْسَانُ وَلَا الحَيَوَانُ وَلَا النَّبَاتُ | أَنْ يَعِيشَ بِدُونِهِ. | يُغَطِّي المَاءُ أَكْثَرَ مِنْ ثُلُثَيْ سَطْحِ الأَرْضِ، | لَكِنَّ مُعْظَمَهُ مَالِحٌ | لَا يَصْلُحُ لِلشُّرْبِ. | لِذَلِكَ يَجِبُ عَلَيْنَا | أَنْ نُحَافِظَ عَلَى المَاءِ العَذْبِ | وَلَا نُسْرِفَ فِي اسْتِخْدَامِهِ. | نَسْتَطِيعُ أَنْ نُغْلِقَ الصُّنْبُورَ | أَثْنَاءَ تَنْظِيفِ أَسْنَانِنَا، | وَأَنْ نُصْلِحَ أَيَّ تَسْرِيبٍ فِي البَيْتِ بِسُرْعَةٍ. | هَذِهِ أَفْعَالٌ بَسِيطَةٌ، | لَكِنَّهَا تَصْنَعُ فَرْقًا كَبِيرًا | إِذَا قَامَ بِهَا كُلُّ النَّاسِ.'},
 {id:'t8',level:4,title:'الصَّبْرُ طَرِيقُ النَّجَاحِ',body:'كَانَ هُنَاكَ شَابٌّ | يَحْلُمُ أَنْ يُصْبِحَ رَسَّامًا مَاهِرًا. | فِي البِدَايَةِ | كَانَتْ رُسُومَاتُهُ بَسِيطَةً، | وَكَانَ بَعْضُ أَصْدِقَائِهِ يَضْحَكُونَ مِنْهَا. | لَكِنَّهُ لَمْ يَسْتَسْلِمْ، | وَظَلَّ يَتَدَرَّبُ كُلَّ يَوْمٍ | سَاعَةً وَاحِدَةً عَلَى الأَقَلِّ. | مَرَّتِ السَّنَوَاتُ، | وَتَحَسَّنَتْ رُسُومَاتُهُ شَيْئًا فَشَيْئًا، | حَتَّى أُقِيمَ لَهُ مَعْرِضٌ كَبِيرٌ | فِي وَسَطِ المَدِينَةِ. | وَقَفَ أَمَامَ لَوْحَاتِهِ مُبْتَسِمًا وَقَالَ: | النَّجَاحُ لَا يَأْتِي فَجْأَةً، | بَلْ يَأْتِي بِالصَّبْرِ وَالتَّدْرِيبِ.'},
 {id:'t9',level:5,title:'الرِّسَالَةُ القَدِيمَةُ',body:'بَيْنَمَا كَانَتْ نُورُ تُرَتِّبُ خِزَانَةَ جَدَّتِهَا | وَجَدَتْ صُنْدُوقًا خَشَبِيًّا صَغِيرًا | مُغَطًّى بِطَبَقَةٍ رَقِيقَةٍ مِنَ الغُبَارِ. | فَتَحَتْهُ بِحَذَرٍ، | فَوَجَدَتْ بِدَاخِلِهِ رِسَالَةً مَطْوِيَّةً | اصْفَرَّتْ أَطْرَافُهَا مَعَ مُرُورِ السِّنِينَ. | كَانَ الخَطُّ جَمِيلًا وَمَائِلًا قَلِيلًا، | وَفِي أَعْلَى الصَّفْحَةِ تَارِيخٌ قَدِيمٌ | يَعُودُ إِلَى أَكْثَرَ مِنْ خَمْسِينَ عَامًا. | قَرَأَتِ السَّطْرَ الأَوَّلَ بِصَوْتٍ مُنْخَفِضٍ: | «إِلَى صَدِيقَتِي العَزِيزَةِ، لَا تَقْلَقِي، | سَأَعُودُ قَبْلَ أَنْ يَتَفَتَّحَ اليَاسَمِينُ». | رَفَعَتْ نُورُ عَيْنَيْهَا نَحْوَ النَّافِذَةِ، | حَيْثُ كَانَتْ شَجَرَةُ اليَاسَمِينِ فِي الحَدِيقَةِ | تَتَمَايَلُ مَعَ نَسَمَاتِ المَسَاءِ. | تَسَاءَلَتْ فِي نَفْسِهَا: | مَنْ كَتَبَ هَذِهِ الرِّسَالَةَ؟ | وَهَلْ عَادَ حَقًّا كَمَا وَعَدَ؟ | أَعَادَتِ الرِّسَالَةَ إِلَى مَكَانِهَا، | وَقَرَّرَتْ أَنْ تَسْأَلَ جَدَّتَهَا عَنْ سِرِّهَا فِي الصَّبَاحِ.'},
 {id:'t10',level:5,title:'لَيْلَةُ العَاصِفَةِ',body:'اشْتَدَّتِ الرِّيَاحُ فَجْأَةً، | وَبَدَأَتْ قَطَرَاتُ المَطَرِ الثَّقِيلَةُ | تَضْرِبُ زُجَاجَ النَّوَافِذِ بِعُنْفٍ. | انْقَطَعَتِ الكَهْرَبَاءُ عَنِ البَيْتِ كُلِّهِ، | فَسَادَ ظَلَامٌ دَامِسٌ | لَا يَقْطَعُهُ إِلَّا ضَوْءُ البَرْقِ بَيْنَ الحِينِ وَالآخَرِ. | تَجَمَّعَ الإِخْوَةُ الثَّلَاثَةُ فِي غُرْفَةِ المَعِيشَةِ، | وَأَشْعَلَ أَكْبَرُهُمْ شَمْعَةً صَغِيرَةً | وَضَعَهَا فِي مُنْتَصَفِ الطَّاوِلَةِ. | قَالَ أَصْغَرُهُمْ بِصَوْتٍ مُرْتَجِفٍ: | «هَلْ سَمِعْتُمْ هَذَا الصَّوْتَ؟». | أَنْصَتَ الجَمِيعُ فِي صَمْتٍ، | فَإِذَا بِطَرَقَاتٍ خَفِيفَةٍ مُتَقَطِّعَةٍ | تَأْتِي مِنْ جِهَةِ البَابِ الخَلْفِيِّ. | تَبَادَلُوا النَّظَرَاتِ القَلِقَةَ، | ثُمَّ نَهَضَ أَوْسَطُهُمْ مُمْسِكًا بِالمِصْبَاحِ اليَدَوِيِّ، | وَتَقَدَّمَ بِخُطُوَاتٍ بَطِيئَةٍ نَحْوَ البَابِ. | فَتَحَهُ بِبُطْءٍ شَدِيدٍ، | فَوَجَدَ قِطًّا مُبَلَّلًا يَرْتَجِفُ مِنَ البَرْدِ، | يَنْظُرُ إِلَيْهِ بِعَيْنَيْنِ وَاسِعَتَيْنِ | كَأَنَّهُ يَطْلُبُ الإِذْنَ بِالدُّخُولِ.'},
 {id:'t11',level:6,title:'بَيْتُ الجَدَّةِ',body:'لَمْ يَكُنْ بَيْتُ جَدَّتِي مُجَرَّدَ جُدْرَانٍ وَسَقْفٍ، | بَلْ كَانَ عَالَمًا كَامِلًا | تَسْكُنُهُ الحِكَايَاتُ وَالرَّوَائِحُ وَالأَصْوَاتُ. | مَا زِلْتُ أَذْكُرُ رَائِحَةَ الخُبْزِ السَّاخِنِ | الَّتِي كَانَتْ تَتَسَلَّلُ مِنَ المَطْبَخِ مَعَ أُولَى خُيُوطِ الفَجْرِ، | وَصَوْتَ المِذْيَاعِ القَدِيمِ | وَهُوَ يَبُثُّ أُغْنِيَاتٍ لَا أَعْرِفُ أَسْمَاءَهَا | لَكِنَّنِي أَحْفَظُ أَلْحَانَهَا عَنْ ظَهْرِ قَلْبٍ. | كَانَتْ جَدَّتِي تَجْلِسُ كُلَّ مَسَاءٍ | عَلَى كُرْسِيِّهَا الخَشَبِيِّ فِي الشُّرْفَةِ، | تُرَاقِبُ المَارَّةَ وَتُحَيِّيهِمْ بِأَسْمَائِهِمْ، | كَأَنَّ الحَيَّ كُلَّهُ عَائِلَتُهَا الكَبِيرَةُ. | وَحِينَ كُنَّا نَلْتَفُّ حَوْلَهَا، | كَانَتْ تَبْدَأُ حِكَايَاتِهَا بِجُمْلَةٍ وَاحِدَةٍ لَا تَتَغَيَّرُ، | ثُمَّ تَأْخُذُنَا إِلَى أَزْمِنَةٍ بَعِيدَةٍ | وَأَمَاكِنَ لَمْ نَرَهَا قَطُّ. | كَبِرْتُ الآنَ، | وَتَغَيَّرَتْ مَلَامِحُ الحَيِّ، | وَأُغْلِقَ البَيْتُ مُنْذُ سَنَوَاتٍ. | لَكِنَّنِي كُلَّمَا شَمَمْتُ رَائِحَةَ خُبْزٍ سَاخِنٍ | أَوْ سَمِعْتُ لَحْنًا قَدِيمًا، | عُدْتُ طِفْلًا صَغِيرًا | يَجْلِسُ عِنْدَ قَدَمَيْهَا | مُنْتَظِرًا أَنْ تَبْدَأَ الحِكَايَةُ.'},
 {id:'t12',level:6,title:'المَكْتَبَةُ المَهْجُورَةُ',body:'فِي آخِرِ الشَّارِعِ القَدِيمِ | كَانَتْ هُنَاكَ مَكْتَبَةٌ مَهْجُورَةٌ | أَغْلَقَتْ أَبْوَابَهَا مُنْذُ زَمَنٍ طَوِيلٍ، | وَصَارَتْ نَوَافِذُهَا المُغْبَرَّةُ | تَعْكِسُ ضَوْءَ الشَّمْسِ بِلَوْنٍ بَاهِتٍ. | كَانَ أَهْلُ الحَيِّ يَتَحَاشَوْنَ المُرُورَ أَمَامَهَا، | وَيَتَنَاقَلُونَ عَنْهَا قِصَصًا غَرِيبَةً | لَا يَعْرِفُ أَحَدٌ مَصْدَرَهَا. | أَمَّا سَلِيمٌ فَلَمْ يَكُنْ يُصَدِّقُ تِلْكَ القِصَصَ، | وَكَانَ الفُضُولُ يَدْفَعُهُ كُلَّ يَوْمٍ | إِلَى الوُقُوفِ أَمَامَ بَابِهَا الحَدِيدِيِّ لِدَقَائِقَ. | وَفِي صَبَاحِ أَحَدِ الأَيَّامِ | لَاحَظَ أَنَّ البَابَ مَفْتُوحٌ قَلِيلًا. | تَرَدَّدَ لَحْظَةً، | ثُمَّ دَفَعَهُ بِيَدِهِ فَانْفَتَحَ بِصَرِيرٍ طَوِيلٍ. | وَجَدَ الرُّفُوفَ مُمْتَلِئَةً بِالكُتُبِ | مُرَتَّبَةً تَرْتِيبًا دَقِيقًا، | وَكَأَنَّ أَحَدًا يَعْتَنِي بِهَا كُلَّ يَوْمٍ. | وَعَلَى الطَّاوِلَةِ الكَبِيرَةِ فِي المُنْتَصَفِ | كَانَ هُنَاكَ كِتَابٌ مَفْتُوحٌ، | وَبِجَانِبِهِ فِنْجَانُ شَايٍ | مَا زَالَ البُخَارُ يَتَصَاعَدُ مِنْهُ. | شَعَرَ سَلِيمٌ بِقُشَعْرِيرَةٍ تَسْرِي فِي جَسَدِهِ، | لَكِنَّهُ اقْتَرَبَ مِنَ الكِتَابِ رَغْمَ خَوْفِهِ، | فَقَرَأَ فِي أَعْلَى الصَّفْحَةِ | اسْمَهُ مَكْتُوبًا بِخَطٍّ أَنِيقٍ.'},
 {id:'t13',level:1,title:'العُصْفُورُ',body:'عَلَى الشُّبَّاكِ | عُصْفُورٌ صَغِيرٌ. | لَوْنُهُ أَصْفَرُ جَمِيلٌ. | يُغَرِّدُ كُلَّ صَبَاحٍ. | وَضَعَ عَلِيٌّ لَهُ | حَبَّاتٍ مِنَ القَمْحِ. | أَكَلَ العُصْفُورُ | وَطَارَ فَرْحَانَ.'},
 {id:'t14',level:1,title:'حَدِيقَةُ البَيْتِ',body:'فِي بَيْتِنَا | حَدِيقَةٌ صَغِيرَةٌ. | فِيهَا وَرْدٌ أَحْمَرُ | وَشَجَرَةُ لَيْمُونٍ. | تَسْقِي هِنْدُ الوَرْدَ | كُلَّ يَوْمٍ. | وَأَنَا أَجْمَعُ اللَّيْمُونَ | مَعَ أَبِي.'},
 {id:'t15',level:1,title:'الكُرَةُ الحَمْرَاءُ',body:'لَعِبَ سَامِي | بِالكُرَةِ الحَمْرَاءِ. | رَمَى الكُرَةَ عَالِيًا | فَوَقَعَتْ فَوْقَ الشَّجَرَةِ. | حَزِنَ سَامِي كَثِيرًا. | جَاءَ أَخُوهُ الكَبِيرُ | وَأَنْزَلَ الكُرَةَ. | شَكَرَهُ سَامِي | وَعَادَ يَلْعَبُ.'},
 {id:'t16',level:2,title:'عِيدُ مِيلَادِ جَدِّي',body:'اليَوْمَ عِيدُ مِيلَادِ جَدِّي. | صَنَعَتْ أُمِّي | كَعْكَةً كَبِيرَةً بِالشُّوكُولَاتَةِ. | وَرَسَمَتْ أُخْتِي سَارَةُ | بِطَاقَةً مُلَوَّنَةً. | أَمَّا أَنَا | فَكَتَبْتُ لَهُ رِسَالَةً قَصِيرَةً | أَقُولُ فِيهَا: | أُحِبُّكَ يَا جَدِّي. | فِي المَسَاءِ | اجْتَمَعَتِ العَائِلَةُ حَوْلَهُ، | وَغَنَّيْنَا لَهُ مَعًا. | ضَحِكَ جَدِّي | وَقَالَ: أَنْتُمْ أَجْمَلُ هَدِيَّةٍ.'},
 {id:'t17',level:2,title:'الطَّبِيبُ الصَّغِيرُ',body:'يُحِبُّ كَرِيمٌ | أَنْ يَصِيرَ طَبِيبًا. | عِنْدَهُ حَقِيبَةٌ صَغِيرَةٌ | فِيهَا سَمَّاعَةٌ وَمِيزَانُ حَرَارَةٍ. | كُلَّ يَوْمٍ | يَفْحَصُ دُمْيَةَ أُخْتِهِ | وَيَقُولُ لَهَا: | لَا تَخَافِي، | سَتَكُونِينَ بِخَيْرٍ. | وَحِينَ مَرِضَتْ جَدَّتُهُ | جَلَسَ بِجَانِبِهَا | وَأَحْضَرَ لَهَا كُوبَ مَاءٍ. | ابْتَسَمَتِ الجَدَّةُ | وَقَالَتْ: أَنْتَ أَحْسَنُ طَبِيبٍ.'},
 {id:'t18',level:2,title:'فِي المَكْتَبَةِ',body:'ذَهَبَ فَصْلُنَا | إِلَى مَكْتَبَةِ المَدْرَسَةِ. | كَانَتِ المَكْتَبَةُ هَادِئَةً | وَمَلِيئَةً بِالكُتُبِ المُلَوَّنَةِ. | اخْتَارَتْ رِيمُ | كِتَابًا عَنِ الحَيَوَانَاتِ، | وَاخْتَارَ زِيَادٌ | قِصَّةً عَنِ الفَضَاءِ. | جَلَسْنَا نَقْرَأُ بِصَمْتٍ | حَتَّى انْتَهَتِ الحِصَّةُ. | قَالَتِ المُعَلِّمَةُ: | الكِتَابُ صَدِيقٌ | لَا يَتْرُكُكَ أَبَدًا.'},
 {id:'t19',level:3,title:'الجَمَلُ سَفِينَةُ الصَّحْرَاءِ',body:'يَعِيشُ الجَمَلُ فِي الصَّحْرَاءِ | حَيْثُ الحَرُّ الشَّدِيدُ | وَالمَاءُ القَلِيلُ. | وَقَدْ مَنَحَهُ اللَّهُ صِفَاتٍ | تُسَاعِدُهُ عَلَى الحَيَاةِ هُنَاكَ. | فَلَهُ سَنَامٌ | يُخَزِّنُ فِيهِ الدُّهُونَ | لِيَسْتَخْدِمَهَا حِينَ يَقِلُّ الطَّعَامُ. | وَلَهُ رُمُوشٌ طَوِيلَةٌ | تَحْمِي عَيْنَيْهِ مِنَ الرِّمَالِ. | وَيَسْتَطِيعُ أَنْ يَمْشِيَ أَيَّامًا | دُونَ أَنْ يَشْرَبَ. | لِذَلِكَ اسْتَخْدَمَهُ النَّاسُ قَدِيمًا | فِي السَّفَرِ وَنَقْلِ البَضَائِعِ، | وَسَمَّوْهُ سَفِينَةَ الصَّحْرَاءِ.'},
 {id:'t20',level:3,title:'شَجَرَةُ جَدِّي',body:'فِي حَدِيقَةِ بَيْتِنَا | شَجَرَةُ مَانْجُو كَبِيرَةٌ | زَرَعَهَا جَدِّي | قَبْلَ أَنْ أُولَدَ. | كَانَ جَدِّي يَسْقِيهَا كُلَّ صَبَاحٍ | وَيَقُولُ لِي: | نَحْنُ نَزْرَعُ اليَوْمَ | لِيَأْكُلَ غَيْرُنَا غَدًا. | لَمْ أَفْهَمْ كَلَامَهُ فِي البِدَايَةِ. | وَفِي الصَّيْفِ المَاضِي | امْتَلَأَتِ الشَّجَرَةُ بِالثِّمَارِ، | فَجَمَعْنَا مِنْهَا الكَثِيرَ | وَوَزَّعْنَاهُ عَلَى الجِيرَانِ. | عِنْدَهَا فَهِمْتُ | مَا كَانَ يَقْصِدُهُ جَدِّي.'},
 {id:'t21',level:3,title:'المُبَارَاةُ النِّهَائِيَّةُ',body:'كَانَ فَرِيقُ مَدْرَسَتِنَا | يَلْعَبُ المُبَارَاةَ النِّهَائِيَّةَ. | امْتَلَأَ المَلْعَبُ بِالطُّلَّابِ | وَالأَهَالِي وَالمُعَلِّمِينَ. | فِي الشَّوْطِ الأَوَّلِ | سَجَّلَ الفَرِيقُ المُنَافِسُ هَدَفًا، | فَحَزِنَ الجَمِيعُ. | لَكِنَّ المُدَرِّبَ شَجَّعَ اللَّاعِبِينَ | وَقَالَ لَهُمْ: | لَا تَسْتَسْلِمُوا، | الْعَبُوا مَعًا كَفَرِيقٍ وَاحِدٍ. | وَفِي الشَّوْطِ الثَّانِي | سَجَّلَ فَرِيقُنَا هَدَفَيْنِ رَائِعَيْنِ. | وَحِينَ انْتَهَتِ المُبَارَاةُ | رَفَعَ اللَّاعِبُونَ الكَأْسَ عَالِيًا | وَسَطَ هُتَافِ الجُمْهُورِ.'},
 {id:'t22',level:4,title:'نَهْرُ النِّيلِ',body:'يُعَدُّ نَهْرُ النِّيلِ | مِنْ أَطْوَلِ أَنْهَارِ العَالَمِ، | إِذْ يَجْرِي مَسَافَةً تَزِيدُ عَلَى سِتَّةِ آلَافِ كِيلُومِتْرٍ. | يَنْبُعُ مِنْ قَلْبِ إِفْرِيقِيَا، | وَيَمُرُّ بِعِدَّةِ دُوَلٍ | حَتَّى يَصِلَ إِلَى مِصْرَ، | ثُمَّ يَصُبُّ فِي البَحْرِ المُتَوَسِّطِ. | وَقَدْ قَامَتْ عَلَى ضِفَافِهِ | حَضَارَةُ المِصْرِيِّينَ القُدَمَاءِ، | فَزَرَعُوا الأَرْضَ حَوْلَهُ، | وَبَنَوْا المُدُنَ وَالمَعَابِدَ. | وَمَا زَالَ النِّيلُ حَتَّى اليَوْمِ | المَصْدَرَ الرَّئِيسِيَّ لِلْمِيَاهِ فِي مِصْرَ، | يَشْرَبُ مِنْهُ النَّاسُ | وَيَسْقُونَ بِهِ زُرُوعَهُمْ. | لِذَلِكَ قِيلَ قَدِيمًا: | مِصْرُ هِبَةُ النِّيلِ.'},
 {id:'t23',level:4,title:'الأَمَانَةُ',body:'خَرَجَ حَمْزَةُ مِنَ المَدْرَسَةِ | فَوَجَدَ عَلَى الرَّصِيفِ | مِحْفَظَةً بُنِّيَّةً صَغِيرَةً. | فَتَحَهَا فَوَجَدَ فِيهَا مَالًا كَثِيرًا | وَبِطَاقَةً عَلَيْهَا اسْمُ صَاحِبِهَا وَعُنْوَانُهُ. | فَكَّرَ قَلِيلًا، | ثُمَّ قَرَّرَ أَنْ يُعِيدَهَا بِنَفْسِهِ. | سَارَ إِلَى العُنْوَانِ | وَطَرَقَ البَابَ، | فَفَتَحَ لَهُ رَجُلٌ عَجُوزٌ | يَبْدُو عَلَيْهِ القَلَقُ. | وَحِينَ رَأَى المِحْفَظَةَ | تَهَلَّلَ وَجْهُهُ فَرَحًا، | وَقَالَ: | فِيهَا ثَمَنُ دَوَائِي لِهَذَا الشَّهْرِ. | شَكَرَهُ الرَّجُلُ كَثِيرًا، | وَعَادَ حَمْزَةُ إِلَى بَيْتِهِ | وَقَلْبُهُ مَلِيءٌ بِالسَّعَادَةِ.'},
 {id:'t24',level:4,title:'الرَّحَّالَةُ ابْنُ بَطُّوطَةَ',body:'وُلِدَ ابْنُ بَطُّوطَةَ | فِي مَدِينَةِ طَنْجَةَ بِالمَغْرِبِ | قَبْلَ نَحْوِ سَبْعِمِائَةِ عَامٍ. | وَحِينَ بَلَغَ الحَادِيَةَ وَالعِشْرِينَ | خَرَجَ لِأَدَاءِ فَرِيضَةِ الحَجِّ، | لَكِنَّ رِحْلَتَهُ لَمْ تَنْتَهِ هُنَاكَ. | فَقَدْ ظَلَّ يَتَنَقَّلُ بَيْنَ البِلَادِ | نَحْوَ ثَلَاثِينَ عَامًا، | فَزَارَ مِصْرَ وَالشَّامَ وَالعِرَاقَ، | وَوَصَلَ إِلَى الهِنْدِ وَالصِّينِ. | وَكَانَ فِي كُلِّ مَكَانٍ | يُرَاقِبُ عَادَاتِ النَّاسِ | وَطَعَامَهُمْ وَمَلَابِسَهُمْ. | وَعِنْدَمَا عَادَ إِلَى بَلَدِهِ | رَوَى مَا رَآهُ، | فَدُوِّنَتْ حِكَايَاتُهُ فِي كِتَابٍ | مَا زَالَ النَّاسُ يَقْرَؤُونَهُ حَتَّى اليَوْمِ.'},
 {id:'t25',level:5,title:'السَّاعَةُ المُتَوَقِّفَةُ',body:'فِي غُرْفَةِ الجُلُوسِ | كَانَتْ هُنَاكَ سَاعَةُ حَائِطٍ قَدِيمَةٌ | تَوَقَّفَتْ عَقَارِبُهَا | عِنْدَ الثَّالِثَةِ وَالرُّبْعِ تَمَامًا. | لَمْ يُحَاوِلْ أَحَدٌ فِي البَيْتِ إِصْلَاحَهَا، | وَكُلَّمَا سَأَلَتْ هَنَاءُ أَبَاهَا عَنْهَا | ابْتَسَمَ وَغَيَّرَ الحَدِيثَ. | وَذَاتَ يَوْمٍ | قَرَّرَتْ أَنْ تَكْتَشِفَ السِّرَّ بِنَفْسِهَا. | أَحْضَرَتْ كُرْسِيًّا، | وَوَقَفَتْ عَلَيْهِ بِحَذَرٍ، | ثُمَّ أَنْزَلَتِ السَّاعَةَ عَنِ الحَائِطِ. | فِي ظَهْرِهَا | وَجَدَتْ وَرَقَةً صَغِيرَةً مُلْصَقَةً | كُتِبَ عَلَيْهَا بِخَطٍّ دَقِيقٍ: | «فِي هَذِهِ السَّاعَةِ | وُلِدَتِ ابْنَتِي الأُولَى». | شَعَرَتْ هَنَاءُ بِدِفْءٍ يَمْلَأُ قَلْبَهَا، | فَقَدْ كَانَتْ تَعْرِفُ جَيِّدًا | أَنَّهَا هِيَ الابْنَةُ الأُولَى. | أَعَادَتِ السَّاعَةَ إِلَى مَكَانِهَا بِرِفْقٍ، | وَفَهِمَتْ أَخِيرًا | لِمَاذَا لَمْ يُصْلِحْهَا أَبُوهَا أَبَدًا.'},
 {id:'t26',level:5,title:'الطَّائِرَةُ الوَرَقِيَّةُ',body:'كَانَ مَازِنٌ يَقْضِي عُطْلَتَهُ | فِي قَرْيَةِ جَدِّهِ الصَّغِيرَةِ، | وَكَانَ يَشْعُرُ بِالمَلَلِ | لِأَنَّهُ لَا يَعْرِفُ أَحَدًا هُنَاكَ. | فِي صَبَاحِ يَوْمٍ مُشْمِسٍ | رَأَى فِي السَّمَاءِ | طَائِرَةً وَرَقِيَّةً مُلَوَّنَةً | تَرْتَفِعُ وَتَنْخَفِضُ مَعَ الرِّيحِ. | تَتَبَّعَ خَيْطَهَا بِعَيْنَيْهِ | حَتَّى وَصَلَ إِلَى صَبِيٍّ | يَقِفُ عَلَى تَلَّةٍ قَرِيبَةٍ. | اقْتَرَبَ مِنْهُ بِخَجَلٍ | وَسَأَلَهُ: كَيْفَ صَنَعْتَهَا؟ | ضَحِكَ الصَّبِيُّ وَقَالَ: | تَعَالَ غَدًا، | وَسَأُعَلِّمُكَ كَيْفَ تَصْنَعُ وَاحِدَةً. | فِي اليَوْمِ التَّالِي | جَلَسَ الاثْنَانِ تَحْتَ شَجَرَةِ تُوتٍ | يَقُصَّانِ الوَرَقَ | وَيَرْبِطَانِ العِيدَانَ الرَّفِيعَةَ. | وَقَبْلَ الغُرُوبِ | كَانَتْ طَائِرَتَانِ تُحَلِّقَانِ جَنْبًا إِلَى جَنْبٍ، | وَمَعَهُمَا صَدَاقَةٌ جَدِيدَةٌ | بَدَأَتْ تَكْبُرُ فِي قَلْبِ مَازِنٍ.'},
 {id:'t27',level:5,title:'الجَزِيرَةُ المَجْهُولَةُ',body:'بَعْدَ ثَلَاثَةِ أَيَّامٍ فِي عُرْضِ البَحْرِ | لَاحَ لِلْبَحَّارَةِ فِي الأُفُقِ | خَطٌّ أَخْضَرُ رَفِيعٌ. | صَاحَ الفَتَى الوَاقِفُ عَلَى السَّارِيَةِ: | «أَرْضٌ! أَرْضٌ أَمَامَنَا!». | اقْتَرَبَتِ السَّفِينَةُ بِبُطْءٍ، | فَظَهَرَتْ جَزِيرَةٌ صَغِيرَةٌ | تُغَطِّيهَا أَشْجَارُ النَّخِيلِ، | وَتُحِيطُ بِهَا رِمَالٌ بَيْضَاءُ نَاعِمَةٌ. | نَزَلَ القُبْطَانُ وَمَعَهُ ثَلَاثَةٌ مِنَ البَحَّارَةِ | فِي قَارِبٍ صَغِيرٍ، | وَمَا إِنْ وَطِئَتْ أَقْدَامُهُمُ الشَّاطِئَ | حَتَّى لَاحَظُوا آثَارَ أَقْدَامٍ | تَتَّجِهُ نَحْوَ الغَابَةِ. | تَبَادَلُوا النَّظَرَاتِ فِي صَمْتٍ؛ | فَالخَرَائِطُ كُلُّهَا تَقُولُ | إِنَّ هَذِهِ الجَزِيرَةَ غَيْرُ مَأْهُولَةٍ. | تَقَدَّمَ القُبْطَانُ بِحَذَرٍ | وَتَبِعَهُ الآخَرُونَ، | وَكُلَّمَا تَوَغَّلُوا بَيْنَ الأَشْجَارِ | ازْدَادَتْ أَصْوَاتُ الطُّيُورِ ارْتِفَاعًا، | حَتَّى وَصَلُوا إِلَى كُوخٍ خَشَبِيٍّ | يَتَصَاعَدُ مِنْ مِدْخَنَتِهِ دُخَانٌ رَمَادِيٌّ.'},
 {id:'t28',level:6,title:'دَفْتَرُ أَبِي',body:'بَعْدَ أَعْوَامٍ طَوِيلَةٍ | عَثَرْتُ فِي دُرْجِ المَكْتَبِ القَدِيمِ | عَلَى دَفْتَرٍ جِلْدِيٍّ | تَآكَلَتْ أَطْرَافُهُ | وَبَهَتَ لَوْنُ غِلَافِهِ. | فَتَحْتُهُ بِيَدٍ مُتَرَدِّدَةٍ، | فَإِذَا هُوَ دَفْتَرُ أَبِي، | يُدَوِّنُ فِيهِ يَوْمِيَّاتِهِ | مُنْذُ كَانَ شَابًّا فِي مِثْلِ عُمْرِي. | قَرَأْتُ عَنْ أَحْلَامِهِ الأُولَى، | وَعَنْ خَوْفِهِ يَوْمَ سَافَرَ وَحِيدًا | إِلَى مَدِينَةٍ لَا يَعْرِفُ فِيهَا أَحَدًا، | وَعَنْ فَرْحَتِهِ الغَامِرَةِ | حِينَ حَصَلَ عَلَى عَمَلِهِ الأَوَّلِ. | كَانَتِ الكَلِمَاتُ بَسِيطَةً، | لَكِنَّهَا كَشَفَتْ لِي وَجْهًا آخَرَ | لِلرَّجُلِ الَّذِي ظَنَنْتُ أَنَّنِي أَعْرِفُهُ جَيِّدًا. | لَمْ يَكُنْ ذَلِكَ الأَبَ الصَّارِمَ القَوِيَّ دَائِمًا، | بَلْ كَانَ إِنْسَانًا يَتَرَدَّدُ وَيَخَافُ وَيَحْلُمُ، | تَمَامًا كَمَا أَفْعَلُ أَنَا الآنَ. | أَغْلَقْتُ الدَّفْتَرَ بِهُدُوءٍ، | وَقَرَّرْتُ أَنْ أَبْدَأَ دَفْتَرِي الخَاصَّ، | لَعَلَّ أَحَدًا يَقْرَؤُهُ يَوْمًا | فَيَفْهَمَنِي كَمَا فَهِمْتُ أَبِي.'},
 {id:'t29',level:6,title:'القِطَارُ الأَخِيرُ',body:'وَصَلَتْ لَيْلَى إِلَى المَحَطَّةِ | وَعَقَارِبُ السَّاعَةِ تُشِيرُ إِلَى الحَادِيَةَ عَشْرَةَ لَيْلًا، | فَوَجَدَتِ الرَّصِيفَ خَالِيًا إِلَّا مِنْ رَجُلٍ عَجُوزٍ | يَجْلِسُ عَلَى مَقْعَدٍ خَشَبِيٍّ | وَقَدْ وَضَعَ حَقِيبَتَهُ الجِلْدِيَّةَ عَلَى رُكْبَتَيْهِ. | كَانَ القِطَارُ الأَخِيرُ قَدْ تَأَخَّرَ، | وَالبَرْدُ يَتَسَلَّلُ إِلَى عِظَامِهَا | رَغْمَ مِعْطَفِهَا الثَّقِيلِ. | جَلَسَتْ عَلَى طَرَفِ المَقْعَدِ، | فَالْتَفَتَ إِلَيْهَا العَجُوزُ وَقَالَ بِصَوْتٍ هَادِئٍ: | «أَتَعْلَمِينَ أَنَّنِي أَنْتَظِرُ هَذَا القِطَارَ | مُنْذُ أَرْبَعِينَ عَامًا؟». | ظَنَّتْ أَنَّهُ يَمْزَحُ، | لَكِنَّ عَيْنَيْهِ كَانَتَا جَادَّتَيْنِ تَمَامًا. | أَخْبَرَهَا أَنَّهُ وَدَّعَ أَخَاهُ فِي هَذِهِ المَحَطَّةِ | وَهُمَا شَابَّانِ، | وَوَعَدَهُ أَخُوهُ أَنْ يَعُودَ فِي القِطَارِ الأَخِيرِ | مِنْ لَيْلَةٍ شِتْوِيَّةٍ كَهَذِهِ. | وَمُنْذُ ذَلِكَ الحِينِ | يَأْتِي كُلَّ عَامٍ فِي اللَّيْلَةِ نَفْسِهَا، | وَيَجْلِسُ فِي المَكَانِ نَفْسِهِ. | وَفِي تِلْكَ اللَّحْظَةِ | سُمِعَ صَفِيرُ القِطَارِ مِنْ بَعِيدٍ، | فَوَقَفَ العَجُوزُ مُمْسِكًا بِحَقِيبَتِهِ، | وَقَدْ لَمَعَ فِي عَيْنَيْهِ أَمَلٌ | لَمْ تَرَ لَيْلَى مِثْلَهُ مِنْ قَبْلُ.'},
 {id:'t30',level:6,title:'البَحْرُ وَالصَّخْرَةُ',body:'عَلَى شَاطِئٍ بَعِيدٍ | كَانَتْ تَقِفُ صَخْرَةٌ ضَخْمَةٌ | تَتَحَدَّى أَمْوَاجَ البَحْرِ مُنْذُ آلَافِ السِّنِينَ. | كَانَتِ الأَمْوَاجُ تَأْتِي كُلَّ يَوْمٍ | فَتَضْرِبُهَا بِقُوَّةٍ ثُمَّ تَعُودُ، | وَكَانَتِ الصَّخْرَةُ تَضْحَكُ مِنْهَا | وَتَقُولُ بِغُرُورٍ: | «لَنْ تَسْتَطِيعِي أَنْ تُحَرِّكِينِي شِبْرًا وَاحِدًا». | لَمْ تَكُنِ الأَمْوَاجُ تُجِيبُ، | بَلْ كَانَتْ تَعُودُ فِي اليَوْمِ التَّالِي | بِالهُدُوءِ نَفْسِهِ وَالإِصْرَارِ نَفْسِهِ. | مَرَّتِ السِّنُونَ، | وَبَدَأَتْ شُقُوقٌ صَغِيرَةٌ | تَظْهَرُ عَلَى جَسَدِ الصَّخْرَةِ، | ثُمَّ أَخَذَتْ حَوَافُّهَا الحَادَّةُ تَسْتَدِيرُ وَتَنْعُمُ، | حَتَّى صَارَتْ مَلْسَاءَ | كَأَنَّ يَدًا خَفِيَّةً صَقَلَتْهَا. | وَذَاتَ صَبَاحٍ | نَظَرَتِ الصَّخْرَةُ إِلَى نَفْسِهَا فِي المَاءِ، | فَلَمْ تَعْرِفْ صُورَتَهَا. | عِنْدَئِذٍ أَدْرَكَتْ | أَنَّ القُوَّةَ لَيْسَتْ فِي الشِّدَّةِ وَالعُنْفِ، | بَلْ فِي الصَّبْرِ وَالاسْتِمْرَارِ؛ | فَالقَطْرَةُ الَّتِي لَا تَتَوَقَّفُ | تَصْنَعُ مَا لَا تَصْنَعُهُ العَاصِفَةُ.'},
 {id:'t31',level:8,title:'المَنَارَةُ',body:'عَلَى حَافَّةِ جَزِيرَةٍ صَخْرِيَّةٍ بَعِيدَةٍ | كَانَتْ تَقُومُ مَنَارَةٌ بَيْضَاءُ عَالِيَةٌ، | يَسْكُنُهَا حَارِسٌ عَجُوزٌ اسْمُهُ عَبْدُ الرَّحِيمِ. | ظَلَّ هَذَا الرَّجُلُ أَرْبَعِينَ عَامًا | يَصْعَدُ كُلَّ مَسَاءٍ دَرَجَاتِهَا الحَلَزُونِيَّةَ الطَّوِيلَةَ، | لِيُشْعِلَ المِصْبَاحَ الكَبِيرَ فِي قِمَّتِهَا، | فَيَدُورَ ضَوْؤُهُ فَوْقَ البَحْرِ | وَيَهْدِيَ السُّفُنَ بَعِيدًا عَنِ الصُّخُورِ. | وَفِي صَبَاحِ أَحَدِ الأَيَّامِ | وَصَلَتْهُ رِسَالَةٌ رَسْمِيَّةٌ | تُخْبِرُهُ أَنَّ المَنَارَةَ سَتَعْمَلُ قَرِيبًا بِأَجْهِزَةٍ آلِيَّةٍ، | وَأَنَّ اللَّيْلَةَ القَادِمَةَ سَتَكُونُ لَيْلَتَهُ الأَخِيرَةَ فِيهَا. | قَرَأَ الرِّسَالَةَ مَرَّتَيْنِ، | ثُمَّ طَوَاهَا بِهُدُوءٍ وَوَضَعَهَا فِي جَيْبِهِ، | وَخَرَجَ يَتَأَمَّلُ البَحْرَ طَوِيلًا. | فِي تِلْكَ اللَّيْلَةِ | هَبَّتْ عَاصِفَةٌ لَمْ تَشْهَدِ الجَزِيرَةُ مِثْلَهَا مُنْذُ سَنَوَاتٍ، | وَارْتَفَعَتِ الأَمْوَاجُ حَتَّى كَادَتْ تَبْلُغُ نَوَافِذَ المَنَارَةِ. | وَفَجْأَةً انْطَفَأَ المِصْبَاحُ، | وَغَرِقَ كُلُّ شَيْءٍ فِي ظَلَامٍ دَامِسٍ. | لَمْ يَتَرَدَّدِ العَجُوزُ لَحْظَةً وَاحِدَةً؛ | أَمْسَكَ فَانُوسَهُ القَدِيمَ، | وَصَعِدَ الدَّرَجَاتِ وَهُوَ يَلْهَثُ، | ثُمَّ أَخَذَ يُصْلِحُ الأَسْلَاكَ بِأَصَابِعَ مُرْتَجِفَةٍ | عَلَى ضَوْءٍ خَافِتٍ. | وَمِنْ بَعِيدٍ | لَمَحَ أَضْوَاءَ سَفِينَةِ صَيْدٍ صَغِيرَةٍ | تَتَّجِهُ مُبَاشَرَةً نَحْوَ الصُّخُورِ. | ضَاعَفَ جُهْدَهُ، | وَبَعْدَ دَقَائِقَ بَدَتْ لَهُ كَأَنَّهَا سَاعَاتٌ، | عَادَ المِصْبَاحُ يَدُورُ مِنْ جَدِيدٍ، | وَانْحَرَفَتِ السَّفِينَةُ فِي آخِرِ لَحْظَةٍ | نَحْوَ المِيَاهِ الآمِنَةِ. | جَلَسَ عَبْدُ الرَّحِيمِ عَلَى الأَرْضِ مُتْعَبًا، | وَابْتَسَمَ ابْتِسَامَةً هَادِئَةً؛ | فَقَدْ أَدْرَكَ أَنَّ الآلَاتِ قَدْ تُضِيءُ المِصْبَاحَ، | لَكِنَّهَا لَا تَعْرِفُ مَعْنَى السَّهَرِ عَلَى أَرْوَاحِ النَّاسِ. | وَفِي الصَّبَاحِ | رَسَتِ السَّفِينَةُ عِنْدَ الجَزِيرَةِ، | وَنَزَلَ مِنْهَا صَيَّادٌ شَابٌّ | يَحْمِلُ سَلَّةً مِنَ السَّمَكِ الطَّازَجِ، | وَقَالَ وَعَيْنَاهُ تَلْمَعَانِ: | «جِئْتُ أَشْكُرُ مَنْ أَنْقَذَنَا البَارِحَةَ».'},
 {id:'t32',level:8,title:'الخَطَّاطُ العَجُوزُ',body:'فِي حَارَةٍ ضَيِّقَةٍ مِنْ حَوَارِي القَاهِرَةِ القَدِيمَةِ | كَانَ هُنَاكَ دُكَّانٌ صَغِيرٌ لِخَطَّاطٍ عَجُوزٍ، | تَتَدَلَّى عَلَى جُدْرَانِهِ لَوْحَاتٌ | كُتِبَتْ بِخُطُوطٍ مُخْتَلِفَةٍ: | النَّسْخِ وَالرُّقْعَةِ وَالثُّلُثِ وَالدِّيوَانِيِّ. | كَانَتْ مَرْيَمُ تَمُرُّ بِهِ كُلَّ يَوْمٍ فِي طَرِيقِهَا إِلَى المَدْرَسَةِ، | فَتَقِفُ أَمَامَ زُجَاجِهِ مَبْهُورَةً | بِالحُرُوفِ الَّتِي تَتَمَايَلُ كَأَنَّهَا تَرْقُصُ. | وَذَاتَ يَوْمٍ | اسْتَجْمَعَتْ شَجَاعَتَهَا وَدَخَلَتْ، | وَقَالَتْ بِصَوْتٍ خَافِتٍ: | «أُرِيدُ أَنْ أَتَعَلَّمَ الخَطَّ مِثْلَكَ». | رَفَعَ الرَّجُلُ نَظَّارَتَهُ عَنْ عَيْنَيْهِ، | وَتَأَمَّلَهَا قَلِيلًا، | ثُمَّ نَاوَلَهَا قَلَمًا مِنَ البُوصِ وَوَرَقَةً بَيْضَاءَ، | وَقَالَ: «اكْتُبِي حَرْفَ الأَلِفِ». | كَتَبَتْهُ بِسُرْعَةٍ، | فَابْتَسَمَ وَقَالَ: «أَعِيدِيهِ». | أَعَادَتْهُ مَرَّةً، وَمَرَّتَيْنِ، وَعَشْرَ مَرَّاتٍ، | وَفِي كُلِّ مَرَّةٍ كَانَ يَقُولُ الكَلِمَةَ نَفْسَهَا. | عَادَتْ إِلَى بَيْتِهَا غَاضِبَةً، | وَقَرَّرَتْ أَلَّا تَرْجِعَ إِلَيْهِ أَبَدًا. | لَكِنَّهَا فِي اليَوْمِ التَّالِي | وَجَدَتْ قَدَمَيْهَا تَقُودَانِهَا إِلَى الدُّكَّانِ نَفْسِهِ. | مَرَّتِ الأَسَابِيعُ وَهِيَ لَا تَكْتُبُ إِلَّا الأَلِفَ، | ثُمَّ البَاءَ، ثُمَّ الجِيمَ، | حَتَّى بَدَأَتْ تَشْعُرُ بِأَنَّ يَدَهَا | صَارَتْ تَعْرِفُ الطَّرِيقَ وَحْدَهَا. | وَفِي نِهَايَةِ العَامِ | أَعْطَاهَا الخَطَّاطُ وَرَقَةً كَبِيرَةً، | وَطَلَبَ مِنْهَا أَنْ تَكْتُبَ جُمْلَةً تَخْتَارُهَا. | فَكَّرَتْ طَوِيلًا، | ثُمَّ كَتَبَتْ بِتَأَنٍّ شَدِيدٍ: | «مَنْ صَبَرَ ظَفِرَ». | نَظَرَ العَجُوزُ إِلَى اللَّوْحَةِ صَامِتًا، | ثُمَّ عَلَّقَهَا بِيَدَيْهِ عَلَى الجِدَارِ | بَيْنَ لَوْحَاتِهِ القَدِيمَةِ، | وَقَالَ: «الآنَ فَهِمْتِ سِرَّ الخَطِّ؛ | فَالحَرْفُ الجَمِيلُ لَا يُكْتَبُ بِاليَدِ وَحْدَهَا، | بَلْ يُكْتَبُ بِالصَّبْرِ أَوَّلًا».'},
 {id:'t33',level:8,title:'النَّوْمُ وَأَسْرَارُهُ',body:'يَظُنُّ كَثِيرٌ مِنَ النَّاسِ أَنَّ النَّوْمَ وَقْتٌ ضَائِعٌ، | يَتَوَقَّفُ فِيهِ الجِسْمُ وَالعَقْلُ عَنِ العَمَلِ، | لَكِنَّ العُلَمَاءَ اكْتَشَفُوا أَنَّ الحَقِيقَةَ عَكْسُ ذَلِكَ تَمَامًا. | فَحِينَ نُغْمِضُ أَعْيُنَنَا وَنَسْتَسْلِمُ لِلنَّوْمِ | يَبْدَأُ الدِّمَاغُ عَمَلًا دَقِيقًا وَمُنَظَّمًا | لَا يَسْتَطِيعُ القِيَامَ بِهِ وَنَحْنُ مُسْتَيْقِظُونَ. | فَهُوَ يُرَتِّبُ مَا تَعَلَّمْنَاهُ خِلَالَ اليَوْمِ، | وَيَنْقُلُ المَعْلُومَاتِ المُهِمَّةَ إِلَى الذَّاكِرَةِ الطَّوِيلَةِ، | وَيَتَخَلَّصُ مِمَّا لَا نَحْتَاجُ إِلَيْهِ. | وَلِهَذَا يَنْصَحُ المُخْتَصُّونَ الطُّلَّابَ | أَنْ يَنَامُوا جَيِّدًا فِي لَيْلَةِ الامْتِحَانِ، | بَدَلًا مِنَ السَّهَرِ حَتَّى الفَجْرِ. | وَلَا تَقْتَصِرُ فَوَائِدُ النَّوْمِ عَلَى الذَّاكِرَةِ؛ | فَفِي أَثْنَاءِ النَّوْمِ العَمِيقِ | يُفْرِزُ الجِسْمُ هُرْمُونَاتِ النُّمُوِّ، | وَيُصْلِحُ العَضَلَاتِ المُتْعَبَةَ، | وَيُقَوِّي جِهَازَ المَنَاعَةِ | الَّذِي يَحْمِينَا مِنَ الأَمْرَاضِ. | أَمَّا قِلَّةُ النَّوْمِ | فَتَجْعَلُ الإِنْسَانَ سَرِيعَ الغَضَبِ، | ضَعِيفَ التَّرْكِيزِ، | قَلِيلَ القُدْرَةِ عَلَى اتِّخَاذِ القَرَارَاتِ الصَّحِيحَةِ. | وَيَحْتَاجُ الأَطْفَالُ وَالمُرَاهِقُونَ | إِلَى سَاعَاتِ نَوْمٍ أَطْوَلَ مِنَ الكِبَارِ، | لِأَنَّ أَجْسَامَهُمْ وَعُقُولَهُمْ مَا زَالَتْ تَنْمُو. | وَمِنَ العَادَاتِ الَّتِي تُسَاعِدُ عَلَى نَوْمٍ هَادِئٍ | أَنْ نَنَامَ وَنَسْتَيْقِظَ فِي مَوْعِدٍ ثَابِتٍ كُلَّ يَوْمٍ، | وَأَنْ نَبْتَعِدَ عَنِ الشَّاشَاتِ قَبْلَ النَّوْمِ بِسَاعَةٍ، | لِأَنَّ ضَوْءَهَا يَخْدَعُ الدِّمَاغَ | فَيَظُنُّ أَنَّ النَّهَارَ لَمْ يَنْتَهِ بَعْدُ. | وَيُفِيدُ أَيْضًا أَنْ تَكُونَ الغُرْفَةُ مُظْلِمَةً وَهَادِئَةً، | وَأَنْ نَتَجَنَّبَ الأَكْلَ الثَّقِيلَ فِي آخِرِ اللَّيْلِ. | فَالنَّوْمُ إِذَنْ لَيْسَ رَاحَةً فَقَطْ، | بَلْ هُوَ وَرْشَةُ عَمَلٍ لَيْلِيَّةٌ | يُجَدِّدُ فِيهَا الإِنْسَانُ نَفْسَهُ | لِيَسْتَقْبِلَ يَوْمًا جَدِيدًا بِنَشَاطٍ وَصَفَاءٍ.'},
 {id:'t34',level:8,title:'قَبْلَ الامْتِحَانِ',body:'كَانَتِ السَّاعَةُ تُشِيرُ إِلَى العَاشِرَةِ لَيْلًا، | وَكَانَ يُوسُفُ يَجْلِسُ أَمَامَ كُتُبِهِ المَفْتُوحَةِ | دُونَ أَنْ يَقْرَأَ مِنْهَا سَطْرًا وَاحِدًا. | كَانَ قَلْبُهُ يَخْفِقُ بِسُرْعَةٍ، | وَيَدَاهُ بَارِدَتَيْنِ، | وَفِي رَأْسِهِ صَوْتٌ لَا يَتَوَقَّفُ عَنِ التَّكْرَارِ: | «سَتَنْسَى كُلَّ شَيْءٍ غَدًا، سَتَفْشَلُ». | حَاوَلَ أَنْ يَحْفَظَ القَاعِدَةَ الأَخِيرَةَ فِي النَّحْوِ، | لَكِنَّ الكَلِمَاتِ كَانَتْ تَخْتَلِطُ أَمَامَ عَيْنَيْهِ | كَأَنَّهَا مَكْتُوبَةٌ بِلُغَةٍ لَا يَعْرِفُهَا. | دَخَلَتْ أُمُّهُ الغُرْفَةَ تَحْمِلُ كُوبًا مِنَ الحَلِيبِ الدَّافِئِ، | فَلَاحَظَتْ وَجْهَهُ الشَّاحِبَ، | وَجَلَسَتْ بِجَانِبِهِ دُونَ أَنْ تَسْأَلَهُ شَيْئًا. | وَبَعْدَ لَحَظَاتٍ مِنَ الصَّمْتِ | قَالَ بِصَوْتٍ مُتَقَطِّعٍ: | «أَنَا خَائِفٌ يَا أُمِّي، | أَشْعُرُ أَنَّنِي لَا أَعْرِفُ شَيْئًا». | لَمْ تَقُلْ لَهُ: لَا تَخَفْ، | بَلْ قَالَتْ بِهُدُوءٍ: | «مِنَ الطَّبِيعِيِّ أَنْ تَشْعُرَ بِالقَلَقِ، | فَهَذَا يَعْنِي أَنَّ الأَمْرَ يُهِمُّكَ. | تَعَالَ نُجَرِّبْ شَيْئًا مَعًا». | طَلَبَتْ مِنْهُ أَنْ يُغْمِضَ عَيْنَيْهِ، | وَأَنْ يَأْخُذَ نَفَسًا عَمِيقًا مِنْ أَنْفِهِ | وَهِيَ تَعُدُّ إِلَى أَرْبَعَةٍ، | ثُمَّ يُخْرِجَهُ بِبُطْءٍ مِنْ فَمِهِ. | كَرَّرَ ذَلِكَ عِدَّةَ مَرَّاتٍ، | فَبَدَأَ قَلْبُهُ يَهْدَأُ شَيْئًا فَشَيْئًا. | ثُمَّ قَالَتْ لَهُ: | «الآنَ اكْتُبْ ثَلَاثَةَ أَشْيَاءَ | تَعْرِفُهَا جَيِّدًا فِي هَذِهِ المَادَّةِ». | أَمْسَكَ القَلَمَ مُتَرَدِّدًا، | لَكِنَّهُ فُوجِئَ بِأَنَّهُ كَتَبَ خَمْسَةً، ثُمَّ سَبْعَةً، | حَتَّى امْتَلَأَتِ الصَّفْحَةُ. | نَظَرَ إِلَيْهَا مُنْدَهِشًا، | فَابْتَسَمَتْ وَقَالَتْ: | «أَرَأَيْتَ؟ المَعْلُومَاتُ كَانَتْ هُنَا طَوَالَ الوَقْتِ، | لَكِنَّ الخَوْفَ كَانَ يُغَطِّيهَا». | أَغْلَقَ يُوسُفُ كُتُبَهُ، | وَشَرِبَ الحَلِيبَ الدَّافِئَ، | وَنَامَ تِلْكَ اللَّيْلَةَ نَوْمًا هَادِئًا | لَمْ يَعْرِفْهُ مُنْذُ أَيَّامٍ.'},
 {id:'t35',level:8,title:'شَارِعُ المُعِزِّ',body:'إِذَا أَرَدْتَ أَنْ تُسَافِرَ عَبْرَ الزَّمَنِ دُونَ آلَةٍ عَجِيبَةٍ، | فَمَا عَلَيْكَ إِلَّا أَنْ تَمْشِيَ فِي شَارِعِ المُعِزِّ لِدِينِ اللَّهِ | فِي قَلْبِ القَاهِرَةِ القَدِيمَةِ. | يَمْتَدُّ هَذَا الشَّارِعُ بَيْنَ بَابِ الفُتُوحِ فِي الشَّمَالِ | وَبَابِ زُوَيْلَةَ فِي الجَنُوبِ، | وَيُعَدُّ مِنْ أَغْنَى شَوَارِعِ العَالَمِ بِالآثَارِ الإِسْلَامِيَّةِ. | مَا إِنْ تَخْطُوَ فِيهِ خُطُوَاتِكَ الأُولَى | حَتَّى تُحِيطَ بِكَ المَسَاجِدُ العَتِيقَةُ بِمَآذِنِهَا الشَّامِخَةِ، | وَالأَسْبِلَةُ الَّتِي كَانَتْ تَسْقِي العَطْشَى مَجَّانًا، | وَالبُيُوتُ القَدِيمَةُ بِنَوَافِذِهَا الخَشَبِيَّةِ المُزَخْرَفَةِ | الَّتِي تُسَمَّى المَشْرَبِيَّاتِ. | كَانَتْ هَذِهِ المَشْرَبِيَّاتُ تَسْمَحُ لِلْهَوَاءِ وَالضَّوْءِ بِالدُّخُولِ، | وَتَحْفَظُ فِي الوَقْتِ نَفْسِهِ خُصُوصِيَّةَ أَهْلِ البَيْتِ. | وَعَلَى جَانِبَيِ الطَّرِيقِ | تَنْتَشِرُ وِرَشُ النُّحَاسِ وَمَحَلَّاتُ العِطَارَةِ، | فَتَخْتَلِطُ رَائِحَةُ القِرْفَةِ وَالكَمُّونِ | بِصَوْتِ المَطَارِقِ الصَّغِيرَةِ | وَهِيَ تَنْقُشُ الزَّخَارِفَ عَلَى الأَوَانِي اللَّامِعَةِ. | وَفِي المَسَاءِ | تُضَاءُ الوَاجِهَاتُ الحَجَرِيَّةُ بِأَنْوَارٍ ذَهَبِيَّةٍ هَادِئَةٍ، | فَيَتَحَوَّلُ الشَّارِعُ إِلَى لَوْحَةٍ حَيَّةٍ، | يَتَجَوَّلُ فِيهَا الكِبَارُ وَالصِّغَارُ، | وَيَلْتَقِطُ السَّائِحُونَ صُوَرَهُمْ أَمَامَ الأَبْوَابِ الضَّخْمَةِ. | لَقَدْ مَرَّتْ عَلَى هَذَا المَكَانِ قُرُونٌ طَوِيلَةٌ، | وَتَعَاقَبَتْ عَلَيْهِ دُوَلٌ وَحُكَّامٌ، | وَتَغَيَّرَ كُلُّ شَيْءٍ حَوْلَهُ، | لَكِنَّهُ مَا زَالَ يَحْتَفِظُ بِرُوحِهِ الأُولَى. | وَحِينَ تُغَادِرُهُ | تَشْعُرُ أَنَّكَ لَمْ تَزُرْ شَارِعًا فَحَسْبُ، | بَلْ قَرَأْتَ صَفَحَاتٍ مِنْ تَارِيخِ مِصْرَ | مَكْتُوبَةً بِالحَجَرِ وَالخَشَبِ وَالنُّحَاسِ.'},
 {id:'t36',level:7,title:'جِدَارُ الحَيِّ',body:'فِي نِهَايَةِ شَارِعِنَا | كَانَ هُنَاكَ جِدَارٌ رَمَادِيٌّ طَوِيلٌ | تَقَشَّرَ طِلَاؤُهُ، | وَامْتَلَأَ بِالخُطُوطِ العَشْوَائِيَّةِ وَالإِعْلَانَاتِ المُمَزَّقَةِ. | كَانَ النَّاسُ يَمُرُّونَ بِهِ كُلَّ يَوْمٍ | دُونَ أَنْ يَلْتَفِتَ إِلَيْهِ أَحَدٌ، | كَأَنَّهُ جُزْءٌ مِنَ الحُزْنِ الَّذِي اعْتَادُوهُ. | أَمَّا سَلْمَى فَكَانَتْ تَرَاهُ كُلَّ صَبَاحٍ مِنْ نَافِذَتِهَا، | وَتَتَخَيَّلُهُ مُغَطًّى بِالأَشْجَارِ وَالعَصَافِيرِ وَالأَلْوَانِ. | وَذَاتَ مَسَاءٍ | رَسَمَتْ عَلَى وَرَقَةٍ صَغِيرَةٍ | صُورَةً لِلْجِدَارِ كَمَا تَحْلُمُ بِهِ، | وَعَرَضَتْهَا عَلَى جَارِهِمُ العَمِّ مَحْمُودٍ، | صَاحِبِ مَحَلِّ الدِّهَانَاتِ فِي أَوَّلِ الشَّارِعِ. | تَأَمَّلَ الرَّجُلُ الرَّسْمَ طَوِيلًا، | ثُمَّ قَالَ مُبْتَسِمًا: | «الأَلْوَانُ عَلَيَّ، وَالرَّسْمُ عَلَيْكِ». | فِي يَوْمِ الجُمُعَةِ | حَمَلَتْ سَلْمَى فُرَشَهَا وَوَقَفَتْ أَمَامَ الجِدَارِ وَحْدَهَا، | وَبَدَأَتْ تَرْسُمُ أَوَّلَ غُصْنٍ أَخْضَرَ. | بَعْدَ قَلِيلٍ اقْتَرَبَ طِفْلَانِ يَسْأَلَانِ عَمَّا تَفْعَلُ، | فَأَعْطَتْ كُلًّا مِنْهُمَا فُرْشَاةً. | ثُمَّ جَاءَتْ جَارَةٌ بِأَكْوَابِ الشَّايِ، | وَجَاءَ شَابٌّ يَحْمِلُ سُلَّمًا لِيَصِلَ إِلَى الأَمَاكِنِ العَالِيَةِ. | وَمَعَ غُرُوبِ الشَّمْسِ | كَانَ نِصْفُ الحَيِّ وَاقِفًا أَمَامَ الجِدَارِ، | وَالأَيْدِي المُلَطَّخَةُ بِالأَلْوَانِ | تَرْسُمُ شَجَرَةً كَبِيرَةً تَمْتَدُّ فُرُوعُهَا مِنْ طَرَفٍ إِلَى طَرَفٍ. | لَمْ يَعُدِ الجِدَارُ رَمَادِيًّا بَعْدَ ذَلِكَ اليَوْمِ، | وَلَمْ يَعُدِ النَّاسُ يَمُرُّونَ بِهِ دُونَ أَنْ يَبْتَسِمُوا؛ | فَقَدْ صَارَ كُلُّ وَاحِدٍ مِنْهُمْ | يَعْرِفُ أَنَّ لَهُ فِيهِ وَرَقَةً خَضْرَاءَ رَسَمَهَا بِيَدِهِ.'},
 {id:'t37',level:7,title:'الأَشْجَارُ تَتَحَدَّثُ',body:'حِينَ نَمْشِي فِي غَابَةٍ هَادِئَةٍ | قَدْ نَظُنُّ أَنَّ الأَشْجَارَ كَائِنَاتٌ صَامِتَةٌ، | يَقِفُ كُلٌّ مِنْهَا وَحِيدًا فِي مَكَانِهِ | لَا يَشْعُرُ بِمَا حَوْلَهُ. | لَكِنَّ العُلَمَاءَ اكْتَشَفُوا فِي العُقُودِ الأَخِيرَةِ | أَنَّ تَحْتَ أَقْدَامِنَا عَالَمًا خَفِيًّا مُدْهِشًا. | فَجُذُورُ الأَشْجَارِ تَتَّصِلُ بِخُيُوطٍ دَقِيقَةٍ مِنَ الفِطْرِيَّاتِ | تَنْتَشِرُ فِي التُّرْبَةِ كَشَبَكَةٍ وَاسِعَةٍ، | وَتَنْقُلُ بَيْنَ الأَشْجَارِ المَاءَ وَالغِذَاءَ وَالإِشَارَاتِ. | وَقَدْ لَاحَظَ البَاحِثُونَ | أَنَّ الشَّجَرَةَ الكَبِيرَةَ القَوِيَّةَ | قَدْ تُرْسِلُ جُزْءًا مِنْ غِذَائِهَا عَبْرَ هَذِهِ الشَّبَكَةِ | إِلَى شُجَيْرَاتٍ صَغِيرَةٍ تَنْمُو فِي الظِّلِّ | وَلَا تَصِلُهَا أَشِعَّةُ الشَّمْسِ الكَافِيَةُ. | وَإِذَا هَاجَمَتِ الحَشَرَاتُ شَجَرَةً مَا | فَإِنَّهَا قَدْ تُطْلِقُ مَوَادَّ كِيمْيَائِيَّةً فِي الهَوَاءِ أَوْ عَبْرَ الجُذُورِ، | فَتَسْتَعِدُّ الأَشْجَارُ المُجَاوِرَةُ لِلدِّفَاعِ عَنْ نَفْسِهَا | قَبْلَ أَنْ يَصِلَ إِلَيْهَا الخَطَرُ. | وَلِهَذَا يَرَى بَعْضُ العُلَمَاءِ | أَنَّ الغَابَةَ لَيْسَتْ مَجْمُوعَةً مِنَ الأَشْجَارِ المُتَفَرِّقَةِ، | بَلْ هِيَ أَشْبَهُ بِمُجْتَمَعٍ مُتَعَاوِنٍ | يُسَاعِدُ أَفْرَادُهُ بَعْضُهُمْ بَعْضًا عَلَى البَقَاءِ. | وَمَا زَالَ هَذَا المَجَالُ يَحْمِلُ أَسْئِلَةً كَثِيرَةً | يَبْحَثُ العُلَمَاءُ عَنْ إِجَابَاتِهَا، | لَكِنَّهُ يُذَكِّرُنَا بِحَقِيقَةٍ جَمِيلَةٍ: | أَنَّ القُوَّةَ الحَقِيقِيَّةَ فِي الطَّبِيعَةِ | لَا تَكُونُ دَائِمًا فِي الانْفِرَادِ وَالمُنَافَسَةِ، | بَلْ كَثِيرًا مَا تَكُونُ فِي التَّرَابُطِ وَالتَّعَاوُنِ.'},
 {id:'t38',level:7,title:'المَرْكَزُ الثَّانِي',body:'أُعْلِنَتْ نَتِيجَةُ مُسَابَقَةِ القِصَّةِ القَصِيرَةِ فِي الإِذَاعَةِ المَدْرَسِيَّةِ، | وَوَقَفَتْ نَادِيَةُ بَيْنَ زَمِيلَاتِهَا تَنْتَظِرُ سَمَاعَ اسْمِهَا، | فَقَدْ قَضَتْ أُسْبُوعَيْنِ كَامِلَيْنِ | تَكْتُبُ قِصَّتَهَا وَتُعِيدُ كِتَابَتَهَا. | لَكِنَّ المُدِيرَةَ نَطَقَتِ اسْمَ صَدِيقَتِهَا المُقَرَّبَةِ هَالَةَ | فِي المَرْكَزِ الأَوَّلِ، | ثُمَّ ذَكَرَتِ اسْمَ نَادِيَةَ فِي المَرْكَزِ الثَّانِي. | صَفَّقَ الجَمِيعُ، | وَصَفَّقَتْ نَادِيَةُ مَعَهُمْ، | لَكِنَّهَا شَعَرَتْ بِشَيْءٍ ثَقِيلٍ يَضْغَطُ عَلَى صَدْرِهَا. | فِي الفُسْحَةِ | جَاءَتْ هَالَةُ تَرْكُضُ نَحْوَهَا فَرِحَةً، | فَابْتَعَدَتْ نَادِيَةُ بِحُجَّةِ أَنَّهَا مَشْغُولَةٌ، | وَجَلَسَتْ وَحْدَهَا فِي آخِرِ المَلْعَبِ. | كَانَتْ تَعْرِفُ أَنَّ صَدِيقَتَهَا لَمْ تُخْطِئْ فِي شَيْءٍ، | وَمَعَ ذَلِكَ كَانَ فِي دَاخِلِهَا صَوْتٌ يَقُولُ: | لِمَاذَا هِيَ وَلَيْسَ أَنَا؟ | فِي المَسَاءِ | حَكَتْ لِأَبِيهَا مَا حَدَثَ بِصَوْتٍ خَافِتٍ، | ثُمَّ قَالَتْ: «أَنَا أُحِبُّ هَالَةَ، | فَلِمَاذَا أَشْعُرُ هَكَذَا؟». | قَالَ أَبُوهَا: | «هَذَا الشُّعُورُ اسْمُهُ الغَيْرَةُ، | وَهُوَ لَا يَعْنِي أَنَّكِ سَيِّئَةٌ، | بَلْ يَعْنِي أَنَّكِ تَمَنَّيْتِ شَيْئًا بِشِدَّةٍ. | المُهِمُّ هُوَ مَاذَا نَفْعَلُ بِهِ». | فِي اليَوْمِ التَّالِي | ذَهَبَتْ نَادِيَةُ إِلَى هَالَةَ، | وَقَالَتْ لَهَا بِصِدْقٍ: | «مَبْرُوكٌ، قِصَّتُكِ تَسْتَحِقُّ الفَوْزَ. | هَلْ تُعَلِّمِينَنِي كَيْفَ كَتَبْتِ تِلْكَ النِّهَايَةَ؟». | ضَحِكَتْ هَالَةُ وَعَانَقَتْهَا، | وَقَالَتْ: «وَأَنْتِ عَلِّمِينِي كَيْفَ تَصِفِينَ الأَمَاكِنَ بِهَذَا الجَمَالِ». | وَمُنْذُ ذَلِكَ اليَوْمِ | صَارَتَا تَكْتُبَانِ مَعًا كُلَّ أُسْبُوعٍ.'},
 {id:'t39',level:7,title:'سُوقُ القَرْيَةِ',body:'مَعَ أَوَّلِ ضَوْءٍ مِنْ صَبَاحِ يَوْمِ الثُّلَاثَاءِ | تَسْتَيْقِظُ القَرْيَةُ عَلَى أَصْوَاتٍ غَيْرِ مَأْلُوفَةٍ: | صَرِيرِ عَجَلَاتِ العَرَبَاتِ الخَشَبِيَّةِ، | وَنَهِيقِ الحَمِيرِ المُحَمَّلَةِ بِالأَقْفَاصِ، | وَنِدَاءَاتِ البَائِعِينَ وَهُمْ يَتَبَادَلُونَ التَّحِيَّاتِ. | فَهَذَا يَوْمُ السُّوقِ الأُسْبُوعِيِّ، | الَّذِي يَنْتَظِرُهُ أَهْلُ القَرْيَةِ وَالقُرَى المُجَاوِرَةِ. | فِي السَّاحَةِ الوَاسِعَةِ بِجِوَارِ المَسْجِدِ | تُفْرَشُ الحُصُرُ عَلَى الأَرْضِ، | وَتُرَصُّ فَوْقَهَا أَكْوَامُ الطَّمَاطِمِ الحَمْرَاءِ | وَالبَاذِنْجَانِ البَنَفْسَجِيِّ اللَّامِعِ | وَحُزَمُ الجِرْجِيرِ وَالبَقْدُونِسِ المُبَلَّلَةِ بِالنَّدَى. | وَفِي رُكْنٍ آخَرَ | تَجْلِسُ النِّسَاءُ أَمَامَ سِلَالِ البَيْضِ وَأَقْرَاصِ الجُبْنِ القَرِيشِ، | وَبِجِوَارِهِنَّ أَقْفَاصُ الدَّجَاجِ وَالبَطِّ | تَمْلَأُ المَكَانَ بِالصِّيَاحِ وَالرَّفْرَفَةِ. | أَمَّا الأَطْفَالُ | فَيَتَجَمَّعُونَ حَوْلَ بَائِعِ الحَلْوَى | الَّذِي يَصْنَعُ غَزْلَ البَنَاتِ الوَرْدِيَّ أَمَامَ أَعْيُنِهِمْ، | أَوْ حَوْلَ رَجُلٍ عَجُوزٍ | يَبِيعُ الأَلْعَابَ الخَشَبِيَّةَ الَّتِي يَصْنَعُهَا بِيَدَيْهِ. | وَلَا يَخْلُو السُّوقُ مِنَ المُسَاوَمَةِ؛ | فَالمُشْتَرِي يُقَلِّلُ مِنَ الثَّمَنِ، | وَالبَائِعُ يُقْسِمُ أَنَّهُ لَا يَرْبَحُ شَيْئًا، | ثُمَّ يَنْتَهِي الأَمْرُ بِضِحْكَةٍ وَاتِّفَاقٍ يُرْضِي الطَّرَفَيْنِ. | وَقَبْلَ أَنْ تَشْتَدَّ حَرَارَةُ الظُّهْرِ | تَبْدَأُ السَّاحَةُ تَخْلُو شَيْئًا فَشَيْئًا، | وَيَعُودُ كُلٌّ إِلَى بَيْتِهِ مُحَمَّلًا بِحَاجَاتِهِ، | وَبِأَخْبَارِ الأُسْبُوعِ الَّتِي سَمِعَهَا مِنَ الجِيرَانِ وَالأَقَارِبِ؛ | فَالسُّوقُ عِنْدَ أَهْلِ القَرْيَةِ | لَيْسَ مَكَانًا لِلْبَيْعِ وَالشِّرَاءِ فَقَطْ، | بَلْ هُوَ مَوْعِدٌ أُسْبُوعِيٌّ لِلِقَاءِ النَّاسِ وَتَجْدِيدِ الوُدِّ بَيْنَهُمْ.'},
 {id:'t40',level:7,title:'القَمَرُ جَارُنَا',body:'القَمَرُ هُوَ أَقْرَبُ الأَجْرَامِ السَّمَاوِيَّةِ إِلَى الأَرْضِ، | وَهُوَ التَّابِعُ الطَّبِيعِيُّ الوَحِيدُ لِكَوْكَبِنَا، | يَدُورُ حَوْلَهُ دَوْرَةً كَامِلَةً فِي نَحْوِ شَهْرٍ. | وَعَلَى الرَّغْمِ مِنْ أَنَّنَا نَرَاهُ مُضِيئًا فِي اللَّيْلِ، | فَإِنَّهُ لَا يُنْتِجُ نُورًا مِنْ ذَاتِهِ، | بَلْ يَعْكِسُ ضَوْءَ الشَّمْسِ السَّاقِطَ عَلَيْهِ. | وَلِهَذَا يَتَغَيَّرُ شَكْلُهُ أَمَامَ أَعْيُنِنَا مِنْ لَيْلَةٍ إِلَى أُخْرَى؛ | فَيَبْدَأُ هِلَالًا رَفِيعًا، | ثُمَّ يَكْبُرُ حَتَّى يَصِيرَ بَدْرًا كَامِلًا، | ثُمَّ يَعُودُ فَيَصْغُرُ حَتَّى يَخْتَفِيَ. | وَقَدِ اعْتَمَدَ العَرَبُ وَالمُسْلِمُونَ عَلَى هَذِهِ الأَطْوَارِ | فِي حِسَابِ الشُّهُورِ القَمَرِيَّةِ، | فَبِرُؤْيَةِ الهِلَالِ يَبْدَأُ شَهْرُ رَمَضَانَ | وَيُعْرَفُ مَوْعِدُ العِيدِ. | وَسَطْحُ القَمَرِ مُخْتَلِفٌ تَمَامًا عَنْ سَطْحِ الأَرْضِ؛ | فَلَا هَوَاءَ فِيهِ وَلَا مَاءَ جَارِيًا، | وَتُغَطِّيهِ طَبَقَةٌ مِنَ الغُبَارِ الرَّمَادِيِّ | وَآلَافُ الحُفَرِ الَّتِي صَنَعَتْهَا النَّيَازِكُ عَلَى مَرِّ العُصُورِ. | وَلِأَنَّهُ بِلَا هَوَاءٍ | تَبْقَى آثَارُ الأَقْدَامِ عَلَى غُبَارِهِ زَمَنًا طَوِيلًا جِدًّا، | فَلَا رِيَاحَ تَمْحُوهَا وَلَا أَمْطَارَ. | وَلِلْقَمَرِ أَثَرٌ وَاضِحٌ فِي حَيَاتِنَا عَلَى الأَرْضِ؛ | فَجَاذِبِيَّتُهُ هِيَ السَّبَبُ الرَّئِيسِيُّ فِي حَرَكَةِ المَدِّ وَالجَزْرِ | الَّتِي يَرْتَفِعُ فِيهَا مَاءُ البَحْرِ وَيَنْخَفِضُ كُلَّ يَوْمٍ. | وَمَا زَالَ القَمَرُ حَتَّى اليَوْمِ | يُثِيرُ خَيَالَ الشُّعَرَاءِ وَفُضُولَ العُلَمَاءِ، | وَتَسْتَعِدُّ دُوَلٌ كَثِيرَةٌ لِإِرْسَالِ رِحْلَاتٍ جَدِيدَةٍ إِلَيْهِ، | لَعَلَّهُ يَصِيرُ يَوْمًا مَحَطَّةً | يَنْطَلِقُ مِنْهَا الإِنْسَانُ لِاسْتِكْشَافِ الفَضَاءِ البَعِيدِ.'},
 {id:'t41',level:9,title:'المُتَرْجِمُ الصَّغِيرُ',body:'لَمْ يَكُنْ عُمَرُ يُحِبُّ اللُّغَةَ العَرَبِيَّةَ فِي طُفُولَتِهِ. | كَانَ قَدْ وُلِدَ وَنَشَأَ فِي مَدِينَةٍ بَعِيدَةٍ لَا يَتَكَلَّمُ أَهْلُهَا العَرَبِيَّةَ، | وَكَانَ يَرَى دُرُوسَهَا الأُسْبُوعِيَّةَ عِبْئًا ثَقِيلًا | يَحْرِمُهُ مِنَ اللَّعِبِ مَعَ أَصْدِقَائِهِ يَوْمَ العُطْلَةِ. | وَكَانَ يَسْأَلُ أُمَّهُ دَائِمًا: | «لِمَاذَا أَتَعَلَّمُهَا وَلَا أَحَدَ هُنَا يَتَحَدَّثُ بِهَا؟». | فَكَانَتْ تَبْتَسِمُ وَتَقُولُ: «سَيَأْتِي يَوْمٌ تَعْرِفُ فِيهِ السَّبَبَ». | وَفِي صَيْفِ ذَلِكَ العَامِ | جَاءَتْ جَدَّتُهُ لِزِيَارَتِهِمْ لِأَوَّلِ مَرَّةٍ، | وَهِيَ لَا تَعْرِفُ كَلِمَةً وَاحِدَةً مِنْ لُغَةِ البَلَدِ. | وَبَعْدَ أَيَّامٍ قَلِيلَةٍ شَعَرَتْ بِتَعَبٍ مُفَاجِئٍ، | فَأَخَذُوهَا إِلَى المُسْتَشْفَى، | وَكَانَ أَبُوهُ وَأُمُّهُ مَشْغُولَيْنِ بِالأَوْرَاقِ وَالإِجْرَاءَاتِ. | جَلَسَ عُمَرُ بِجَانِبِ جَدَّتِهِ فِي غُرْفَةِ الفَحْصِ، | وَدَخَلَتِ الطَّبِيبَةُ تَسْأَلُهَا عَنْ أَلَمِهَا، | فَنَظَرَتِ الجَدَّةُ إِلَيْهَا فِي حَيْرَةٍ وَخَوْفٍ. | عِنْدَئِذٍ وَجَدَ عُمَرُ نَفْسَهُ يَتَكَلَّمُ دُونَ تَفْكِيرٍ؛ | يَسْمَعُ سُؤَالَ الطَّبِيبَةِ فَيَنْقُلُهُ إِلَى جَدَّتِهِ بِالعَرَبِيَّةِ، | ثُمَّ يَسْمَعُ جَوَابَهَا فَيُتَرْجِمُهُ لِلطَّبِيبَةِ. | تَعَثَّرَ فِي بَعْضِ الكَلِمَاتِ، | وَاسْتَعَانَ بِيَدَيْهِ أَحْيَانًا لِيَشْرَحَ مَا لَا يَعْرِفُ اسْمَهُ، | لَكِنَّهُ نَجَحَ فِي النِّهَايَةِ. | اطْمَأَنَّتِ الطَّبِيبَةُ إِلَى أَنَّ الأَمْرَ بَسِيطٌ، | وَكَتَبَتْ لِلْجَدَّةِ الدَّوَاءَ المُنَاسِبَ. | وَحِينَ خَرَجَا مِنَ الغُرْفَةِ | أَمْسَكَتِ الجَدَّةُ يَدَهُ وَقَبَّلَتْهَا، | وَقَالَتْ بِصَوْتٍ مُرْتَعِشٍ: | «لَوْلَاكَ يَا حَبِيبِي لَمَا فَهِمَنِي أَحَدٌ». | فِي طَرِيقِ العَوْدَةِ | كَانَ عُمَرُ صَامِتًا يَنْظُرُ مِنْ نَافِذَةِ السَّيَّارَةِ، | ثُمَّ الْتَفَتَ إِلَى أُمِّهِ فَجْأَةً وَقَالَ: | «الآنَ عَرَفْتُ السَّبَبَ يَا أُمِّي. | اللُّغَةُ لَيْسَتْ دَرْسًا نَحْفَظُهُ، | بَلْ جِسْرٌ يَصِلُنَا بِمَنْ نُحِبُّ». | وَفِي الأُسْبُوعِ التَّالِي | كَانَ أَوَّلَ مَنْ يَحْضُرُ دَرْسَ العَرَبِيَّةِ، | وَمَعَهُ دَفْتَرٌ صَغِيرٌ جَدِيدٌ | يُسَجِّلُ فِيهِ كُلَّ كَلِمَةٍ يُرِيدُ أَنْ يَقُولَهَا لِجَدَّتِهِ.'},
 {id:'t42',level:9,title:'ابْنُ الهَيْثَمِ وَسِرُّ الضَّوْءِ',body:'عَاشَ الحَسَنُ بْنُ الهَيْثَمِ قَبْلَ نَحْوِ أَلْفِ عَامٍ، | وُلِدَ فِي مَدِينَةِ البَصْرَةِ بِالعِرَاقِ، | ثُمَّ انْتَقَلَ إِلَى القَاهِرَةِ | حَيْثُ قَضَى جُزْءًا كَبِيرًا مِنْ حَيَاتِهِ فِي البَحْثِ وَالتَّأْلِيفِ. | وَقَدْ شَغَلَهُ سُؤَالٌ يَبْدُو لَنَا اليَوْمَ بَسِيطًا: | كَيْفَ نَرَى الأَشْيَاءَ؟ | كَانَ كَثِيرٌ مِنَ العُلَمَاءِ قَبْلَهُ يَعْتَقِدُونَ | أَنَّ العَيْنَ تُرْسِلُ شُعَاعًا يَخْرُجُ مِنْهَا | فَيَلْمَسُ الأَشْيَاءَ فَنَرَاهَا. | لَكِنَّ ابْنَ الهَيْثَمِ لَمْ يَكْتَفِ بِمَا قَالَهُ السَّابِقُونَ، | بَلْ قَرَّرَ أَنْ يَخْتَبِرَ الأَمْرَ بِنَفْسِهِ. | فَأَجْرَى تَجَارِبَ كَثِيرَةً عَلَى الضَّوْءِ وَالمَرَايَا وَالعَدَسَاتِ، | وَدَرَسَ تَرْكِيبَ العَيْنِ بِدِقَّةٍ، | وَلَاحَظَ أَنَّ النَّظَرَ إِلَى الشَّمْسِ يُؤْلِمُ العَيْنَ، | فَاسْتَنْتَجَ أَنَّ الضَّوْءَ هُوَ الَّذِي يَدْخُلُ إِلَيْهَا، | لَا أَنَّهَا هِيَ الَّتِي تُرْسِلُ شَيْئًا إِلَى الخَارِجِ. | وَمِنْ أَشْهَرِ مَا دَرَسَهُ | مَا يُعْرَفُ بِالغُرْفَةِ المُظْلِمَةِ؛ | وَهِيَ غُرْفَةٌ لَا يَدْخُلُهَا الضَّوْءُ إِلَّا مِنْ ثُقْبٍ صَغِيرٍ، | فَتَظْهَرُ عَلَى جِدَارِهَا المُقَابِلِ | صُورَةٌ مَقْلُوبَةٌ لِمَا يُوجَدُ خَارِجَهَا. | وَقَدْ شَرَحَ ابْنُ الهَيْثَمِ هَذِهِ الظَّاهِرَةَ | بِأَنَّ الضَّوْءَ يَسِيرُ فِي خُطُوطٍ مُسْتَقِيمَةٍ، | وَهِيَ الفِكْرَةُ نَفْسُهَا الَّتِي قَامَتْ عَلَيْهَا آلَاتُ التَّصْوِيرِ بَعْدَ قُرُونٍ. | وَجَمَعَ ابْنُ الهَيْثَمِ أَبْحَاثَهُ فِي «كِتَابِ المَنَاظِرِ»، | الَّذِي تُرْجِمَ إِلَى لُغَاتٍ أُخْرَى، | وَظَلَّ العُلَمَاءُ يَرْجِعُونَ إِلَيْهِ زَمَنًا طَوِيلًا. | غَيْرَ أَنَّ أَعْظَمَ مَا تَرَكَهُ لَنَا | لَمْ يَكُنْ مَعْلُومَةً بِعَيْنِهَا، | بَلْ طَرِيقَتَهُ فِي التَّفْكِيرِ؛ | فَقَدْ كَانَ يَرَى أَنَّ عَلَى البَاحِثِ عَنِ الحَقِيقَةِ | أَلَّا يُصَدِّقَ كُلَّ مَا يَقْرَؤُهُ، | وَأَنْ يَخْتَبِرَ الأَفْكَارَ بِالمُلَاحَظَةِ وَالتَّجْرِبَةِ، | وَأَنْ يَتَّهِمَ رَأْيَهُ هُوَ أَيْضًا | حَتَّى لَا يَمِيلَ إِلَى مَا يُحِبُّ. | وَهَذَا هُوَ جَوْهَرُ مَا نُسَمِّيهِ اليَوْمَ: المَنْهَجَ العِلْمِيَّ.'},
 {id:'t43',level:9,title:'الخِلَافُ',body:'لَمْ يَتَكَلَّمْ آدَمُ وَزِيَادٌ مُنْذُ ثَلَاثَةِ أَيَّامٍ. | كَانَا صَدِيقَيْنِ لَا يَفْتَرِقَانِ مُنْذُ الصَّفِّ الأَوَّلِ، | يَجْلِسَانِ عَلَى المَقْعَدِ نَفْسِهِ، | وَيَتَقَاسَمَانِ الطَّعَامَ وَالأَسْرَارَ وَالضَّحِكَاتِ. | لَكِنَّ كُلَّ شَيْءٍ تَغَيَّرَ فِي مُبَارَاةِ كُرَةِ القَدَمِ الأَخِيرَةِ، | حِينَ أَضَاعَ زِيَادٌ فُرْصَةً سَهْلَةً لِلتَّسْجِيلِ، | فَصَرَخَ فِيهِ آدَمُ أَمَامَ الجَمِيعِ: | «أَنْتَ السَّبَبُ فِي خَسَارَتِنَا!». | احْمَرَّ وَجْهُ زِيَادٍ، | وَتَرَكَ المَلْعَبَ دُونَ أَنْ يَنْطِقَ بِكَلِمَةٍ. | مُنْذُ ذَلِكَ اليَوْمِ | صَارَ زِيَادٌ يَجْلِسُ فِي آخِرِ الفَصْلِ، | وَصَارَ آدَمُ يَتَظَاهَرُ بِأَنَّهُ لَا يَهْتَمُّ. | كَانَ يُرَدِّدُ فِي نَفْسِهِ: | «لَقَدْ قُلْتُ الحَقِيقَةَ، لَوْ سَجَّلَ لَفُزْنَا». | لَكِنَّهُ فِي كُلِّ مَرَّةٍ يَنْظُرُ فِيهَا إِلَى المَقْعَدِ الفَارِغِ بِجَانِبِهِ | يَشْعُرُ بِفَرَاغٍ أَكْبَرَ فِي دَاخِلِهِ. | فِي اليَوْمِ الرَّابِعِ | طَلَبَ مِنْهُمَا مُعَلِّمُ العُلُومِ أَنْ يَعْمَلَا مَعًا فِي مَشْرُوعٍ وَاحِدٍ. | جَلَسَا مُتَبَاعِدَيْنِ، | وَكُلٌّ مِنْهُمَا يَنْظُرُ فِي اتِّجَاهٍ. | مَرَّتْ دَقَائِقُ ثَقِيلَةٌ مِنَ الصَّمْتِ، | ثُمَّ قَالَ آدَمُ بِصَوْتٍ مُنْخَفِضٍ دُونَ أَنْ يَرْفَعَ عَيْنَيْهِ: | «زِيَادُ… أَنَا آسِفٌ. | لَمْ يَكُنْ مِنْ حَقِّي أَنْ أَصْرُخَ فِيكَ هَكَذَا. | الجَمِيعُ أَضَاعُوا فُرَصًا فِي تِلْكَ المُبَارَاةِ، | وَأَنَا مِنْهُمْ». | رَفَعَ زِيَادٌ رَأْسَهُ، | وَقَالَ بَعْدَ لَحْظَةٍ: | «لَمْ يُؤْلِمْنِي أَنَّنَا خَسِرْنَا، | آلَمَنِي أَنَّكَ قُلْتَهَا أَمَامَ الجَمِيعِ. | كُنْتُ أَشْعُرُ بِالذَّنْبِ أَصْلًا، | وَكُنْتُ أَحْتَاجُ صَدِيقِي أَنْ يَقِفَ بِجَانِبِي». | سَكَتَ آدَمُ؛ | فَلَمْ يَكُنْ قَدْ فَكَّرَ فِي الأَمْرِ مِنْ هَذِهِ النَّاحِيَةِ. | ثُمَّ مَدَّ يَدَهُ وَقَالَ: | «فِي المُبَارَاةِ القَادِمَةِ، | إِذَا أَضَاعَ أَحَدُنَا هَدَفًا، | سَيَكُونُ الآخَرُ أَوَّلَ مَنْ يُرَبِّتُ عَلَى كَتِفِهِ». | ابْتَسَمَ زِيَادٌ وَصَافَحَهُ، | وَعَادَا إِلَى مَشْرُوعِهِمَا، | وَقَدْ فَهِمَ كُلٌّ مِنْهُمَا شَيْئًا جَدِيدًا: | أَنَّ الاعْتِذَارَ الصَّادِقَ يَحْتَاجُ إِلَى شَجَاعَةٍ، | وَأَنَّ الاسْتِمَاعَ إِلَى شُعُورِ الآخَرِ | قَدْ يُصْلِحُ مَا لَا تُصْلِحُهُ أَلْفُ حُجَّةٍ.'},
 {id:'t44',level:9,title:'لَيْلَةٌ فِي الصَّحْرَاءِ',body:'حِينَ تَوَقَّفَتِ السَّيَّارَةُ وَسَطَ الكُثْبَانِ الرَّمْلِيَّةِ | كَانَتِ الشَّمْسُ تَغِيبُ خَلْفَ الأُفُقِ، | وَتَصْبُغُ الرِّمَالَ بِأَلْوَانٍ تَتَدَرَّجُ مِنَ الذَّهَبِيِّ إِلَى البُرْتُقَالِيِّ | ثُمَّ إِلَى الأَحْمَرِ القَانِي. | نَزَلْنَا نَحْمِلُ أَغْرَاضَنَا، | وَاسْتَقْبَلَنَا الشَّيْخُ سَالِمٌ، دَلِيلُ الرِّحْلَةِ، | بِوَجْهٍ أَسْمَرَ تَمْلَؤُهُ التَّجَاعِيدُ | وَابْتِسَامَةٍ هَادِئَةٍ لَا تُفَارِقُهُ. | أَشْعَلَ نَارًا صَغِيرَةً مِنْ حَطَبِ الأَشْجَارِ الجَافَّةِ، | وَوَضَعَ عَلَيْهَا إِبْرِيقَ الشَّايِ الأَسْوَدَ، | ثُمَّ جَلَسْنَا حَوْلَهُ عَلَى بِسَاطٍ مِنَ الصُّوفِ. | وَمَعَ اخْتِفَاءِ آخِرِ خُيُوطِ الضَّوْءِ | انْخَفَضَتِ الحَرَارَةُ بِسُرْعَةٍ لَمْ نَتَوَقَّعْهَا، | فَلَفَفْنَا أَنْفُسَنَا بِالبَطَّانِيَّاتِ، | وَاقْتَرَبْنَا أَكْثَرَ مِنَ النَّارِ. | وَهُنَا رَفَعْتُ رَأْسِي إِلَى السَّمَاءِ | فَحَبَسْتُ أَنْفَاسِي؛ | لَمْ أَرَ فِي حَيَاتِي هَذَا العَدَدَ مِنَ النُّجُومِ. | كَانَتْ تَمْلَأُ السَّمَاءَ مِنْ طَرَفٍ إِلَى طَرَفٍ، | بَعْضُهَا يَلْمَعُ بِقُوَّةٍ، | وَبَعْضُهَا خَافِتٌ كَأَنَّهُ غُبَارٌ مِنْ نُورٍ، | وَيَقْطَعُهَا شَرِيطٌ أَبْيَضُ بَاهِتٌ | قَالَ الشَّيْخُ سَالِمٌ إِنَّهُ دَرْبُ التَّبَّانَةِ. | ثُمَّ أَخَذَ يُشِيرُ بِعَصَاهُ إِلَى النُّجُومِ | وَيَذْكُرُ أَسْمَاءَهَا العَرَبِيَّةَ القَدِيمَةَ، | وَيَحْكِي كَيْفَ كَانَ أَجْدَادُهُ يَهْتَدُونَ بِهَا فِي أَسْفَارِهِمْ | حِينَ لَا يَكُونُ حَوْلَهُمْ إِلَّا الرَّمْلُ وَالسَّمَاءُ. | قَالَ: «هَذَا هُوَ النَّجْمُ القُطْبِيُّ، | يَبْقَى ثَابِتًا فِي جِهَةِ الشَّمَالِ، | مَنْ عَرَفَهُ لَا يَضِيعُ أَبَدًا». | سَادَ صَمْتٌ عَمِيقٌ لَا يَقْطَعُهُ إِلَّا طَقْطَقَةُ الحَطَبِ، | وَشَعَرْتُ بِأَنَّنِي صَغِيرٌ جِدًّا أَمَامَ هَذَا الكَوْنِ الوَاسِعِ، | لَكِنَّهُ لَمْ يَكُنْ شُعُورًا مُخِيفًا، | بَلْ كَانَ أَقْرَبَ إِلَى الطُّمَأْنِينَةِ. | وَفِي تِلْكَ اللَّيْلَةِ نِمْتُ تَحْتَ السَّمَاءِ المَكْشُوفَةِ، | وَآخِرُ مَا رَأَيْتُهُ قَبْلَ أَنْ أُغْمِضَ عَيْنَيَّ | نَجْمٌ سَاقِطٌ يَرْسُمُ خَطًّا مِنْ ضَوْءٍ | ثُمَّ يَخْتَفِي فِي الظَّلَامِ.'},
 {id:'t45',level:9,title:'لُغَتِي هُوِيَّتِي',body:'اللُّغَةُ العَرَبِيَّةُ مِنْ أَقْدَمِ اللُّغَاتِ الحَيَّةِ فِي العَالَمِ، | وَيَتَحَدَّثُ بِهَا اليَوْمَ مِئَاتُ المَلَايِينِ مِنَ النَّاسِ، | وَيَتَعَلَّمُهَا مَلَايِينُ آخَرُونَ فِي شَتَّى أَنْحَاءِ الأَرْضِ. | وَهِيَ لُغَةُ القُرْآنِ الكَرِيمِ، | وَلِهَذَا ارْتَبَطَتْ فِي قُلُوبِ المُسْلِمِينَ بِالعِبَادَةِ وَالتَّدَبُّرِ، | فَيَتْلُو بِهَا المُسْلِمُ صَلَاتَهُ أَيْنَمَا كَانَ، | حَتَّى لَوْ لَمْ تَكُنْ لُغَةَ بَيْتِهِ وَبَلَدِهِ. | وَتَتَمَيَّزُ العَرَبِيَّةُ بِثَرَاءٍ عَجِيبٍ فِي مُفْرَدَاتِهَا؛ | فَلِلْمَعْنَى الوَاحِدِ فِيهَا كَلِمَاتٌ مُتَعَدِّدَةٌ | تَحْمِلُ كُلٌّ مِنْهَا ظِلًّا خَاصًّا. | فَالحُبُّ مَثَلًا لَهُ دَرَجَاتٌ وَأَسْمَاءٌ، | وَالأَسَدُ لَهُ أَسْمَاءٌ كَثِيرَةٌ، | وَلِلْمَطَرِ أَسْمَاءٌ بِحَسَبِ قُوَّتِهِ وَوَقْتِ نُزُولِهِ. | وَمِنْ أَسْرَارِ جَمَالِهَا نِظَامُ الجُذُورِ وَالاشْتِقَاقِ؛ | فَمِنْ ثَلَاثَةِ أَحْرُفٍ مِثْلِ «كَتَبَ» | نَسْتَطِيعُ أَنْ نَصُوغَ عَشَرَاتِ الكَلِمَاتِ: | كَاتِبٌ وَمَكْتُوبٌ وَكِتَابٌ وَمَكْتَبٌ وَمَكْتَبَةٌ وَمُكَاتَبَةٌ، | وَكُلُّهَا تَدُورُ حَوْلَ مَعْنًى وَاحِدٍ. | فَإِذَا عَرَفَ المُتَعَلِّمُ هَذَا النِّظَامَ | صَارَ قَادِرًا عَلَى فَهْمِ كَلِمَاتٍ لَمْ يَسْمَعْهَا مِنْ قَبْلُ. | وَقَدْ حَمَلَتِ العَرَبِيَّةُ عَبْرَ قُرُونٍ طَوِيلَةٍ | عُلُومَ الطِّبِّ وَالفَلَكِ وَالرِّيَاضِيَّاتِ وَالفَلْسَفَةِ، | وَانْتَقَلَتْ مِنْهَا كَلِمَاتٌ كَثِيرَةٌ إِلَى لُغَاتٍ أُخْرَى | مَا زَالَ النَّاسُ يَسْتَخْدِمُونَهَا حَتَّى اليَوْمِ. | وَلِلْخَطِّ العَرَبِيِّ جَمَالٌ خَاصٌّ، | جَعَلَ مِنْهُ فَنًّا قَائِمًا بِذَاتِهِ | يُزَيِّنُ المَسَاجِدَ وَالقُصُورَ وَالكُتُبَ. | غَيْرَ أَنَّ اللُّغَةَ لَا تَحْيَا بِالإِعْجَابِ وَحْدَهُ، | بَلْ تَحْيَا بِأَنْ نَسْتَعْمِلَهَا: | أَنْ نَقْرَأَ بِهَا، وَنَكْتُبَ بِهَا، | وَنُعَبِّرَ بِهَا عَنْ أَفْكَارِنَا وَمَشَاعِرِنَا. | فَكُلُّ كِتَابٍ نَقْرَؤُهُ بِالعَرَبِيَّةِ، | وَكُلُّ رِسَالَةٍ نَكْتُبُهَا بِهَا، | خُطْوَةٌ نَحْفَظُ بِهَا هَذَا الكَنْزَ | وَنُسَلِّمُهُ لِمَنْ يَأْتِي بَعْدَنَا.'},
 {id:'t46',level:10,title:'الجِسْرُ',body:'عَاشَ فِي قَرْيَةٍ بَعِيدَةٍ أَخَوَانِ | يَمْلِكُ كُلٌّ مِنْهُمَا مَزْرَعَةً عَلَى ضِفَّةٍ مِنْ ضِفَّتَيْ نَهْرٍ صَغِيرٍ. | وَرِثَا الأَرْضَ عَنْ أَبِيهِمَا، | وَظَلَّا سِنِينَ طَوِيلَةً يَعْمَلَانِ مَعًا كَأَنَّهُمَا رَجُلٌ وَاحِدٌ، | يَتَبَادَلَانِ الأَدَوَاتِ وَالبُذُورَ، | وَيُسَاعِدُ كُلٌّ مِنْهُمَا الآخَرَ فِي مَوْسِمِ الحَصَادِ. | ثُمَّ وَقَعَ بَيْنَهُمَا خِلَافٌ صَغِيرٌ عَلَى قِطْعَةِ أَرْضٍ، | فَكَبِرَ الخِلَافُ مَعَ الأَيَّامِ، | وَتَحَوَّلَ إِلَى كَلِمَاتٍ جَارِحَةٍ، | ثُمَّ إِلَى صَمْتٍ طَوِيلٍ لَا يَقْطَعُهُ أَحَدٌ. | وَذَاتَ صَبَاحٍ | طَرَقَ بَابَ الأَخِ الأَكْبَرِ نَجَّارٌ غَرِيبٌ | يَحْمِلُ صُنْدُوقَ أَدَوَاتِهِ عَلَى ظَهْرِهِ، | وَسَأَلَهُ إِنْ كَانَ لَدَيْهِ عَمَلٌ لِأَيَّامٍ قَلِيلَةٍ. | فَكَّرَ الأَخُ قَلِيلًا، | ثُمَّ أَشَارَ إِلَى الضِّفَّةِ الأُخْرَى وَقَالَ بِمَرَارَةٍ: | «أَتَرَى تِلْكَ المَزْرَعَةَ؟ إِنَّهَا لِأَخِي. | أُرِيدُ أَنْ تَبْنِيَ لِي سُورًا خَشَبِيًّا عَالِيًا عَلَى ضِفَّتِي، | حَتَّى لَا أَرَى وَجْهَهُ بَعْدَ اليَوْمِ». | أَوْمَأَ النَّجَّارُ بِرَأْسِهِ، | وَأَخَذَ الأَخْشَابَ وَالمَسَامِيرَ، | فَتَرَكَهُ صَاحِبُ المَزْرَعَةِ وَسَافَرَ إِلَى المَدِينَةِ لِيَقْضِيَ بَعْضَ حَاجَاتِهِ. | وَحِينَ عَادَ فِي المَسَاءِ الثَّالِثِ | وَقَفَ عَلَى ضِفَّةِ النَّهْرِ مَذْهُولًا؛ | فَلَمْ يَجِدْ سُورًا، | بَلْ وَجَدَ جِسْرًا خَشَبِيًّا جَمِيلًا | يَمْتَدُّ فَوْقَ المَاءِ مِنْ أَرْضِهِ إِلَى أَرْضِ أَخِيهِ. | وَقَبْلَ أَنْ يَنْطِقَ بِكَلِمَةٍ غَاضِبَةٍ | رَأَى أَخَاهُ يَعْبُرُ الجِسْرَ نَحْوَهُ بِخُطُوَاتٍ مُتَرَدِّدَةٍ، | وَعَيْنَاهُ تَلْمَعَانِ بِالدُّمُوعِ، | ثُمَّ قَالَ: | «بَعْدَ كُلِّ مَا قُلْتُهُ لَكَ… تَبْنِي لِي جِسْرًا؟ | أَنْتَ أَكْرَمُ مِنِّي يَا أَخِي». | لَمْ يَجِدِ الأَخُ الأَكْبَرُ مَا يَقُولُهُ، | فَتَقَدَّمَ إِلَى مُنْتَصَفِ الجِسْرِ، | وَتَعَانَقَ الأَخَوَانِ طَوِيلًا | كَأَنَّ السِّنِينَ الضَّائِعَةَ تَذُوبُ بَيْنَ ذِرَاعَيْهِمَا. | وَحِينَ الْتَفَتَا | رَأَيَا النَّجَّارَ يَحْمِلُ صُنْدُوقَهُ وَيَسْتَعِدُّ لِلرَّحِيلِ. | قَالَ لَهُ الأَخُ الأَكْبَرُ: | «ابْقَ مَعَنَا، فَعِنْدِي لَكَ أَعْمَالٌ كَثِيرَةٌ». | فَابْتَسَمَ النَّجَّارُ وَقَالَ: | «أَوَدُّ ذَلِكَ، | لَكِنَّ هُنَاكَ جُسُورًا أُخْرَى كَثِيرَةً تَنْتَظِرُنِي». | ثُمَّ مَضَى فِي طَرِيقِهِ، | وَبَقِيَ الجِسْرُ شَاهِدًا عَلَى حَقِيقَةٍ بَسِيطَةٍ: | أَنَّ الأَسْوَارَ تُبْنَى بِالغَضَبِ فِي يَوْمٍ وَاحِدٍ، | أَمَّا الجُسُورُ فَتُبْنَى بِالحِكْمَةِ، | وَتَبْقَى أَجْيَالًا.'},
 {id:'t47',level:10,title:'الشَّاشَاتُ وَعُقُولُنَا',body:'لَمْ يَعْرِفِ الإِنْسَانُ فِي تَارِيخِهِ الطَّوِيلِ أَدَاةً | دَخَلَتْ حَيَاتَهُ بِهَذِهِ السُّرْعَةِ وَهَذَا العُمْقِ | مِثْلَ الشَّاشَاتِ الذَّكِيَّةِ. | فَقَدْ صَارَ الهَاتِفُ فِي جُيُوبِنَا | مَكْتَبَةً وَسِينِمَا وَخَرِيطَةً وَمَدْرَسَةً وَسُوقًا فِي آنٍ وَاحِدٍ، | نَصِلُ بِهِ إِلَى مَعْلُومَاتٍ | كَانَ أَجْدَادُنَا يُسَافِرُونَ الأَيَّامَ لِلْحُصُولِ عَلَيْهَا. | وَلَا شَكَّ أَنَّ فِي هَذَا نِعْمَةً كَبِيرَةً | إِذَا أَحْسَنَّا اسْتِخْدَامَهَا. | غَيْرَ أَنَّ كَثِيرًا مِنَ المُخْتَصِّينَ | يُنَبِّهُونَ إِلَى جَانِبٍ آخَرَ لَا نَنْتَبِهُ إِلَيْهِ غَالِبًا. | فَكَثِيرٌ مِنَ التَّطْبِيقَاتِ مُصَمَّمَةٌ بِعِنَايَةٍ | لِتُبْقِيَنَا أَطْوَلَ وَقْتٍ مُمْكِنٍ أَمَامَهَا؛ | فَالمَقَاطِعُ القَصِيرَةُ تَتَتَابَعُ بِلَا نِهَايَةٍ، | وَالتَّنْبِيهَاتُ تُقَاطِعُنَا كُلَّ بِضْعِ دَقَائِقَ، | وَكُلُّ إِعْجَابٍ جَدِيدٍ يَمْنَحُنَا شُعُورًا سَرِيعًا بِالمُتْعَةِ | يَدْفَعُنَا إِلَى العَوْدَةِ مِنْ جَدِيدٍ. | وَمَعَ التَّكْرَارِ | قَدْ يَعْتَادُ الدِّمَاغُ هَذَا الإِيقَاعَ السَّرِيعَ، | فَيَصْعُبُ عَلَيْنَا أَنْ نُرَكِّزَ فِي كِتَابٍ طَوِيلٍ، | أَوْ أَنْ نَسْتَمِعَ إِلَى شَرْحٍ دُونَ أَنْ تَمْتَدَّ أَيْدِينَا إِلَى الهَاتِفِ، | أَوْ حَتَّى أَنْ نَجْلِسَ مَعَ أَنْفُسِنَا دَقَائِقَ قَلِيلَةً فِي هُدُوءٍ. | وَالمُشْكِلَةُ لَيْسَتْ فِي الشَّاشَةِ ذَاتِهَا، | بَلْ فِي أَنْ تَتَحَوَّلَ مِنْ أَدَاةٍ نَسْتَخْدِمُهَا | إِلَى عَادَةٍ تَسْتَخْدِمُنَا. | وَلِهَذَا يَقْتَرِحُ المُخْتَصُّونَ خُطُوَاتٍ بَسِيطَةً | تُعِيدُ إِلَيْنَا زِمَامَ الأَمْرِ؛ | مِنْهَا أَنْ نُطْفِئَ التَّنْبِيهَاتِ غَيْرَ الضَّرُورِيَّةِ، | وَأَنْ نُخَصِّصَ أَوْقَاتًا وَأَمَاكِنَ خَالِيَةً مِنَ الشَّاشَاتِ، | كَمَائِدَةِ الطَّعَامِ وَغُرْفَةِ النَّوْمِ، | وَأَنْ نَسْأَلَ أَنْفُسَنَا قَبْلَ أَنْ نَفْتَحَ الهَاتِفَ: | لِمَاذَا أَفْتَحُهُ الآنَ؟ وَمَاذَا أُرِيدُ مِنْهُ بِالضَّبْطِ؟ | وَمِنَ المُفِيدِ أَيْضًا | أَنْ نُعَوِّدَ عُقُولَنَا عَلَى أَنْشِطَةٍ تَحْتَاجُ إِلَى صَبْرٍ وَتَرْكِيزٍ، | كَالقِرَاءَةِ وَالرَّسْمِ وَالرِّيَاضَةِ وَالحِوَارِ الهَادِئِ، | فَهِيَ أَشْبَهُ بِتَمَارِينَ تُقَوِّي عَضَلَةَ الانْتِبَاهِ. | إِنَّ التِّقْنِيَةَ سَتَظَلُّ جُزْءًا مِنْ حَيَاتِنَا، | وَلَيْسَ المَطْلُوبُ أَنْ نَهْرُبَ مِنْهَا، | بَلْ أَنْ نَتَعَلَّمَ كَيْفَ نَعِيشُ مَعَهَا بِوَعْيٍ، | فَنَأْخُذَ مِنْهَا أَفْضَلَ مَا فِيهَا، | دُونَ أَنْ نَدْفَعَ ثَمَنَهُ مِنْ أَوْقَاتِنَا وَعُقُولِنَا وَعَلَاقَاتِنَا.'},
 {id:'t48',level:10,title:'رِسَالَةٌ إِلَى نَفْسِي بَعْدَ عَشْرِ سَنَوَاتٍ',body:'عَزِيزِي أَنَا، | حِينَ تَقْرَأُ هَذِهِ الرِّسَالَةَ | سَتَكُونُ قَدْ كَبِرْتَ عَشْرَ سَنَوَاتٍ كَامِلَةٍ، | وَرُبَّمَا تَضْحَكُ مِنْ خَطِّي المُتَعَرِّجِ | وَمِنْ أَشْيَاءَ كَثِيرَةٍ كُنْتُ أَرَاهَا اليَوْمَ مُهِمَّةً جِدًّا. | أَكْتُبُ إِلَيْكَ الآنَ وَأَنَا جَالِسٌ عَلَى مَكْتَبِي الصَّغِيرِ، | وَعَلَى الحَائِطِ أَمَامِي جَدْوَلُ الامْتِحَانَاتِ، | وَفِي قَلْبِي خَلِيطٌ مِنَ الحَمَاسِ وَالخَوْفِ | مِمَّا يَنْتَظِرُنِي فِي السَّنَوَاتِ القَادِمَةِ. | لَا أَعْرِفُ أَيْنَ أَنْتَ الآنَ، | وَلَا مَاذَا تَعْمَلُ، | وَلَا إِنْ كُنْتَ قَدْ حَقَّقْتَ الحُلْمَ الَّذِي أُفَكِّرُ فِيهِ كُلَّ لَيْلَةٍ قَبْلَ النَّوْمِ. | لَكِنَّنِي أُرِيدُ أَنْ أَطْلُبَ مِنْكَ بَعْضَ الأَشْيَاءِ. | أَرْجُو أَلَّا تَكُونَ قَدْ نَسِيتَ أَصْدِقَاءَكَ القُدَامَى | الَّذِينَ ضَحِكُوا مَعَكَ وَوَقَفُوا بِجَانِبِكَ فِي الأَيَّامِ الصَّعْبَةِ، | وَأَنْ تَكُونَ قَدِ اتَّصَلْتَ بِجَدَّتِكَ أَكْثَرَ مِمَّا أَفْعَلُ أَنَا الآنَ. | وَأَرْجُو أَنْ تَكُونَ مَا زِلْتَ تُحِبُّ القِرَاءَةَ، | وَأَنْ تَكُونَ قَدْ قَرَأْتَ تِلْكَ الرِّوَايَاتِ الطَّوِيلَةَ | الَّتِي أُؤَجِّلُهَا دَائِمًا بِحُجَّةِ أَنَّنِي مَشْغُولٌ. | وَإِذَا كُنْتَ قَدْ فَشِلْتَ فِي شَيْءٍ | فَلَا تَقْسُ عَلَى نَفْسِكَ كَثِيرًا؛ | فَأَنَا أَعْرِفُكَ جَيِّدًا، | وَأَعْرِفُ أَنَّكَ تُحَاوِلُ دَائِمًا قَدْرَ اسْتِطَاعَتِكَ. | تَذَكَّرْ أَنَّنِي بَكَيْتُ مَرَّةً لِأَنَّنِي حَصَلْتُ عَلَى دَرَجَةٍ ضَعِيفَةٍ فِي امْتِحَانِ الرِّيَاضِيَّاتِ، | وَظَنَنْتُ يَوْمَهَا أَنَّ العَالَمَ انْتَهَى، | ثُمَّ اكْتَشَفْتُ بَعْدَ شَهْرٍ وَاحِدٍ | أَنَّ الأَمْرَ لَمْ يَكُنْ يَسْتَحِقُّ كُلَّ ذَلِكَ الحُزْنِ. | فَإِذَا وَاجَهَتْكَ مُشْكِلَةٌ تَبْدُو الآنَ كَالجَبَلِ، | فَتَذَكَّرْ أَنَّهَا قَدْ تَصِيرُ بَعْدَ سَنَوَاتٍ ذِكْرَى صَغِيرَةً تَبْتَسِمُ لَهَا. | وَأَخِيرًا، | أَتَمَنَّى أَنْ تَكُونَ إِنْسَانًا طَيِّبًا قَبْلَ أَنْ تَكُونَ نَاجِحًا، | وَأَنْ تَكُونَ قَدْ تَعَلَّمْتَ كَيْفَ تَقُولُ «لَا» حِينَ يَجِبُ، | وَكَيْفَ تَقُولُ «شُكْرًا» وَ«آسِفٌ» دُونَ تَرَدُّدٍ. | وَإِذَا الْتَقَيْتَ يَوْمًا طِفْلًا يُشْبِهُنِي، | قَلِقًا مِنَ المُسْتَقْبَلِ وَمُتَحَمِّسًا لَهُ فِي الوَقْتِ نَفْسِهِ، | فَقُلْ لَهُ مَا كُنْتُ أَحْتَاجُ أَنْ أَسْمَعَهُ: | إِنَّ الطَّرِيقَ أَطْوَلُ مِمَّا تَظُنُّ، | وَأَجْمَلُ مِمَّا تَتَخَيَّلُ، | وَإِنَّكَ لَسْتَ مُضْطَرًّا أَنْ تَعْرِفَ كُلَّ شَيْءٍ الآنَ. | المُخْلِصُ دَائِمًا: | أَنْتَ، قَبْلَ عَشْرِ سَنَوَاتٍ.'},
 {id:'t49',level:10,title:'الغَابَةُ بَعْدَ الحَرِيقِ',body:'فِي صَيْفٍ شَدِيدِ الجَفَافِ | اشْتَعَلَتِ النَّارُ فِي طَرَفِ غَابَةٍ كَبِيرَةٍ عَلَى سَفْحِ الجَبَلِ، | وَسَاعَدَتْهَا الرِّيَاحُ عَلَى الانْتِشَارِ بِسُرْعَةٍ مُخِيفَةٍ. | ظَلَّ رِجَالُ الإِطْفَاءِ أَيَّامًا يُحَارِبُونَ اللَّهَبَ | حَتَّى تَمَكَّنُوا أَخِيرًا مِنْ إِخْمَادِهِ، | لَكِنَّهُمْ حِينَ وَقَفُوا يَنْظُرُونَ إِلَى مَا تَبَقَّى | لَمْ يَرَوْا إِلَّا جُذُوعًا سَوْدَاءَ مُتَفَحِّمَةً | تَنْتَصِبُ فِي أَرْضٍ رَمَادِيَّةٍ صَامِتَةٍ. | لَا عَصَافِيرَ تُغَرِّدُ، | وَلَا أَوْرَاقَ تَتَحَرَّكُ مَعَ النَّسِيمِ، | وَلَا شَيْءَ غَيْرُ رَائِحَةِ الدُّخَانِ الَّتِي تَمْلَأُ المَكَانَ. | قَالَ كَثِيرٌ مِنْ أَهْلِ القُرَى المُجَاوِرَةِ: | لَقَدْ مَاتَتِ الغَابَةُ إِلَى الأَبَدِ. | غَيْرَ أَنَّ عَالِمَةً شَابَّةً تَدْرُسُ النَّبَاتَاتِ | قَرَّرَتْ أَنْ تَزُورَ المَكَانَ كُلَّ شَهْرٍ | وَتُسَجِّلَ مَا تَرَاهُ فِي دَفْتَرِهَا. | فِي الزِّيَارَاتِ الأُولَى لَمْ تَجِدْ شَيْئًا يُذْكَرُ. | ثُمَّ جَاءَتْ أَمْطَارُ الخَرِيفِ، | فَلَاحَظَتْ نِقَاطًا خَضْرَاءَ صَغِيرَةً جِدًّا | تَخْرُجُ مِنْ تَحْتِ الرَّمَادِ. | كَانَتْ تِلْكَ أَعْشَابًا وَنَبَاتَاتٍ سَرِيعَةَ النُّمُوِّ، | وَجَدَتْ فِي الرَّمَادِ غِذَاءً غَنِيًّا، | وَفِي غِيَابِ الأَشْجَارِ العَالِيَةِ ضَوْءًا وَفِيرًا. | وَفِي الرَّبِيعِ التَّالِي | ازْدَادَتِ البُقَعُ الخَضْرَاءُ اتِّسَاعًا، | وَظَهَرَتْ أَزْهَارٌ بَرِّيَّةٌ لَمْ تَكُنْ تَنْمُو هُنَاكَ مِنْ قَبْلُ، | وَعَادَتْ بَعْضُ الحَشَرَاتِ وَالطُّيُورِ الصَّغِيرَةِ. | وَالأَعْجَبُ مِنْ ذَلِكَ | أَنَّ بَعْضَ أَنْوَاعِ الأَشْجَارِ تَحْمِلُ ثِمَارًا قَاسِيَةً مُغْلَقَةً | لَا تَنْفَتِحُ بِسُهُولَةٍ، | وَتُسَاعِدُ حَرَارَةُ النَّارِ عَلَى تَفَتُّحِهَا وَإِطْلَاقِ بُذُورِهَا، | فَكَأَنَّ الحَرِيقَ الَّذِي أَهْلَكَ الأَشْجَارَ القَدِيمَةَ | هُوَ نَفْسُهُ الَّذِي زَرَعَ الأَشْجَارَ الجَدِيدَةَ. | مَرَّتِ السَّنَوَاتُ، | وَارْتَفَعَتِ الشُّجَيْرَاتُ شَيْئًا فَشَيْئًا، | حَتَّى صَارَ الجَبَلُ مَرَّةً أُخْرَى مَكْسُوًّا بِالخُضْرَةِ، | وَإِنْ ظَلَّتْ بَعْضُ الجُذُوعِ السَّوْدَاءِ قَائِمَةً بَيْنَهَا | تَحْكِي مَا مَرَّ بِهِ المَكَانُ. | وَفِي آخِرِ صَفْحَةٍ مِنْ دَفْتَرِهَا كَتَبَتِ العَالِمَةُ: | «تَعَلَّمْتُ مِنْ هَذِهِ الغَابَةِ أَنَّ النِّهَايَةَ قَدْ تَكُونُ بِدَايَةً مُتَنَكِّرَةً، | وَأَنَّ الحَيَاةَ أَصْبَرُ مِنَ النَّارِ، | وَأَنَّ الجِرَاحَ لَا تَخْتَفِي تَمَامًا، | لَكِنَّهَا قَدْ تَصِيرُ جُزْءًا مِنْ قِصَّةٍ أَجْمَلَ».'},
 {id:'t50',level:10,title:'طَرِيقُ الحَرِيرِ',body:'لَمْ يَكُنْ طَرِيقُ الحَرِيرِ طَرِيقًا وَاحِدًا مُمَهَّدًا كَمَا قَدْ يُوحِي اسْمُهُ، | بَلْ كَانَ شَبَكَةً وَاسِعَةً مِنَ الطُّرُقِ البَرِّيَّةِ وَالبَحْرِيَّةِ | تَمْتَدُّ آلَافَ الكِيلُومِتْرَاتِ، | وَتَصِلُ الصِّينَ فِي أَقْصَى الشَّرْقِ | بِبِلَادِ فَارِسَ وَالعَرَبِ، | ثُمَّ بِسَوَاحِلِ البَحْرِ المُتَوَسِّطِ وَأُورُوبَّا. | وَقَدْ أُطْلِقَ عَلَيْهِ هَذَا الاسْمُ | لِأَنَّ الحَرِيرَ الصِّينِيَّ كَانَ مِنْ أَثْمَنِ البَضَائِعِ الَّتِي تُنْقَلُ عَبْرَهُ، | لَكِنَّهُ لَمْ يَكُنْ وَحْدَهُ؛ | فَقَدْ حَمَلَتِ القَوَافِلُ أَيْضًا التَّوَابِلَ وَالبَخُورَ، | وَالأَحْجَارَ الكَرِيمَةَ وَالخَزَفَ، | وَالوَرَقَ الَّذِي غَيَّرَ تَارِيخَ الكِتَابَةِ وَالعِلْمِ. | وَكَانَتِ الرِّحْلَةُ عَلَى هَذِهِ الطُّرُقِ شَاقَّةً وَمَحْفُوفَةً بِالمَخَاطِرِ؛ | فَالقَوَافِلُ تَعْبُرُ صَحَارِيَ قَاحِلَةً تَشْتَدُّ فِيهَا الحَرَارَةُ نَهَارًا وَالبَرْدُ لَيْلًا، | وَتَتَسَلَّقُ جِبَالًا شَاهِقَةً تُغَطِّيهَا الثُّلُوجُ، | وَتَخْشَى قُطَّاعَ الطُّرُقِ وَالعَوَاصِفَ الرَّمْلِيَّةَ. | وَلِهَذَا نَشَأَتْ عَلَى طُولِ الطَّرِيقِ مُدُنٌ وَخَانَاتٌ | يَسْتَرِيحُ فِيهَا التُّجَّارُ وَدَوَابُّهُمْ، | وَيَتَبَادَلُونَ فِيهَا البَضَائِعَ وَالأَخْبَارَ. | وَمِنْ أَشْهَرِ تِلْكَ المُدُنِ سَمَرْقَنْدُ وَبُخَارَى، | الَّتِي ازْدَهَرَتْ وَصَارَتْ مَرَاكِزَ لِلتِّجَارَةِ وَالعِلْمِ وَالعِمَارَةِ. | غَيْرَ أَنَّ أَهَمَّ مَا انْتَقَلَ عَلَى طَرِيقِ الحَرِيرِ | لَمْ يَكُنِ البَضَائِعَ، بَلِ الأَفْكَارَ. | فَقَدِ الْتَقَى عَلَيْهِ النَّاسُ مِنْ أَدْيَانٍ وَلُغَاتٍ وَثَقَافَاتٍ مُخْتَلِفَةٍ، | فَتَبَادَلُوا المَعَارِفَ فِي الطِّبِّ وَالفَلَكِ وَالرِّيَاضِيَّاتِ، | وَتَعَلَّمَ بَعْضُهُمْ مِنْ بَعْضٍ فُنُونَ الزِّرَاعَةِ وَالصِّنَاعَةِ وَالطَّبْخِ. | وَيُرْوَى أَنَّ صِنَاعَةَ الوَرَقِ انْتَقَلَتْ مِنَ الصِّينِ إِلَى سَمَرْقَنْدَ، | ثُمَّ إِلَى بَغْدَادَ وَالقَاهِرَةِ وَالأَنْدَلُسِ، | فَانْتَشَرَتِ الكُتُبُ وَالمَكْتَبَاتُ انْتِشَارًا لَمْ يَعْرِفْهُ العَالَمُ مِنْ قَبْلُ. | وَقَدْ شَارَكَ التُّجَّارُ وَالرَّحَّالَةُ العَرَبُ وَالمُسْلِمُونَ | بِنَصِيبٍ كَبِيرٍ فِي هَذِهِ الحَرَكَةِ، | فَكَانُوا وُسَطَاءَ بَيْنَ الشَّرْقِ وَالغَرْبِ، | وَنَقَلُوا مَا تَعَلَّمُوهُ وَأَضَافُوا إِلَيْهِ. | وَإِذَا تَأَمَّلْنَا قِصَّةَ هَذَا الطَّرِيقِ | أَدْرَكْنَا أَنَّ الحَضَارَاتِ لَا تَنْمُو فِي عُزْلَةٍ، | بَلْ تَزْدَهِرُ حِينَ تَلْتَقِي وَتَتَحَاوَرُ، | وَأَنَّ المَسَافَاتِ البَعِيدَةَ وَالجِبَالَ العَالِيَةَ | لَمْ تَمْنَعِ البَشَرَ يَوْمًا مِنَ البَحْثِ عَنْ بَعْضِهِمْ بَعْضًا.'}
];
