 {id:'guide',type:'guide',t:'تشريح الوصف',d:'اقرأ وصف رحلة مدرسية، وشاهد كيف بُني.',

 {id:'order',type:'order',t:'رتّب الأحداث',d:'رتّب أحداث كل يوم ترتيبًا زمنيًا صحيحًا.',hint:'ابحث عن كلمات الوقت: الصباح، ثم، بعد، في المساء، وحين.',
  tasks:[
   {title:'يوم العيد',items:['استيقظت مع أذان الفجر، واغتسلت ولبست ملابس العيد الجديدة.','ثم خرجت مع أبي إلى ساحة الصلاة، والتكبيرات تملأ الشوارع.','وبعد الصلاة زرنا بيت جدي، فأعطاني العيدية وهو يبتسم.','وفي المساء خرجنا جميعًا إلى الحديقة، وعدنا والتعب يملأ أجسادنا والفرح يملأ قلوبنا.'],why:'الفجر ← الصلاة ← الزيارة ← المساء. لاحظ: ثم، وبعد، وفي المساء.'},
   {title:'المباراة',items:['قبل المباراة بأسبوع، كنا نتدرب كل يوم بعد المدرسة.','وفي يوم المباراة، دخلنا الملعب وقلوبنا تخفق، والجمهور يملأ المدرجات.','وفي الشوط الثاني أحرز زميلي هدف الفوز بضربة رأس رائعة.','وحين أطلق الحكم صفارة النهاية، حملنا زميلنا على الأكتاف ونحن نهتف.'],why:'الاستعداد ← البداية ← اللحظة الحاسمة ← النهاية.'},
   {title:'رحلة إلى البحر',items:['في الصباح الباكر حزمنا الحقائب ووضعناها في السيارة.','وعند الظهيرة وصلنا إلى الشاطئ، فأسرعنا إلى الماء.','وحين مالت الشمس إلى الغروب، جلسنا على الرمال نتأمل لونها البرتقالي.','وفي طريق العودة ليلًا، نمت في السيارة وأنا أحلم بالأمواج.'],why:'الصباح ← الظهيرة ← الغروب ← الليل. ترتيب الشمس نفسه دليلك!'}]},

 {id:'intruder',type:'tap',t:'الجملة الدخيلة',d:'اكتشف الجملة التي خرجت عن الحدث أو ناقضت ترتيبه.',prompt:'اضغط على الجملة أو الجمل التي لا تناسب، ثم «تحقّق».',
  tasks:[
   {title:'رحلة الأقصر',sents:['سافرنا إلى الأقصر في الإجازة الشتوية.','وفي اليوم الأول زرنا معبد الكرنك، فبهرتنا أعمدته الضخمة.','وفي اليوم الثاني عبرنا النيل إلى وادي الملوك.','وأخي يحب لعب الكرة في النادي كل يوم.','وفي المساء الأخير ركبنا الحنطور على الكورنيش.'],bad:[3],why:'عادة أخي في النادي لا علاقة لها بأحداث الرحلة.'},
   {title:'الحفلة المدرسية',sents:['بدأت الحفلة المدرسية في العاشرة صباحًا.','افتتحها المدير بكلمة ترحيب قصيرة.','ثم قدّم فصلنا مسرحية عن الأمانة.','وقبل أن تبدأ الحفلة بساعة، كان الجمهور يصفق لنا في نهاية المسرحية.','وفي ختام الحفلة وُزعت الجوائز على المتفوقين.'],bad:[3],why:'الجملة تناقض الترتيب الزمني: التصفيق في نهاية المسرحية لا يكون قبل بدء الحفلة.'},
