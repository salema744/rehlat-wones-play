 {id:'guide',type:'guide',t:'تشريح القصة',d:'اقرأ قصة قصيرة، وتعرّف على عناصرها ومنحنى أحداثها.',

  <p>${K('climax','وفي الليلة الثالثة، نادته جدته وهي تبتسم:')} ${K('dialog','«أتبحث عن هذا يا آدم؟»')}${K('climax','، ورفعت أمام عينيه مفتاحًا نحاسيًا صغيرًا.')}</p>

 {id:'order',type:'order',t:'رتّب الحبكة',d:'أعد ترتيب أحداث القصة من البداية إلى النهاية.',hint:'ابحث عن الحدث الذي يسبّب ما بعده.',
  tasks:[
   {title:'قصة المسابقة',items:['كانت نور تحلم منذ صغرها بالفوز في مسابقة الإلقاء.','وتدرّبت أسابيع طويلة أمام المرآة على قصيدتها.','لكنها يوم المسابقة وقفت على المسرح، فنسيت البيت الأول كله.','ساد الصمت القاعة، وكادت الدموع تسيل من عينيها.','وفجأة رأت أمها في الصف الأول تحرّك شفتيها بالكلمات، فتذكرت البيت وانطلقت تلقي القصيدة بثقة.','لم تفز نور بالمركز الأول، لكنها خرجت من القاعة وهي تشعر أنها انتصرت على خوفها.'],why:'الحلم ← الاستعداد ← العقدة (النسيان) ← الذروة (الصمت) ← الحل (الأم) ← النهاية.'},
   {title:'قصة الجرو',items:['عاش كريم في عمارة عالية لا يُسمح فيها بتربية الحيوانات.','وفي يوم ممطر، وجد جروًا صغيرًا يرتجف عند باب العمارة.','فخبّأه في غرفته سرًّا، وأخذ يطعمه من طعامه.','لكن نباح الجرو ليلًا أيقظ الجيران، فطرق البواب الباب غاضبًا.','اعترف كريم بكل شيء، فاقترح البواب أن يأخذ الجرو إلى مزرعة أخيه في القرية.','وصار كريم يزور صديقه الصغير كل جمعة، فيستقبله الجرو بذيل لا يتوقف عن الحركة.'],why:'القاعدة ← الحدث المحرّك ← القرار ← الذروة (انكشاف السر) ← الحل ← النهاية.'}]},

   {title:'سباق الدراجات',sents:['كانت سلمى تتدرب كل صباح على دراجتها الحمراء.','وفي يوم السباق، انطلقت مع المتسابقين بحماس.','وفي منتصف الطريق، انفلتت سلسلة دراجة منى، فتوقفت مندهشة.','فتوقفت سلمى لتساعد صديقتها نور على إصلاح السلسلة.','ووصلتا إلى خط النهاية معًا في المركز الأخير، وهما تضحكان.'],bad:[2],fix:{2:'وفي منتصف الطريق، انفلتت سلسلة دراجة نور، فتوقفت حائرة.'},why:'تغيّر اسم الصديقة من «منى» إلى «نور»! حافظ على أسماء الشخصيات ثابتة.'},

 {id:'write',type:'write',t:'ورشة القصة',d:'اكتب قصة قصيرة كاملة من البداية إلى النهاية.',

   {id:'bag',title:'الحقيبة',kind:'بداية مقترحة',task:'ابدأ قصتك بهذه الجملة: «لم يكن يتوقع أن يجد في الحقيبة القديمة...». أكمل القصة كما تشاء.',
    tips:'من وجد الحقيبة؟ أين؟ · ماذا وجد؟ ولماذا يغيّر ذلك شيئًا؟ · ما العقبة؟ · ما اللحظة الحاسمة؟',

     {k:'end',ta:1,min:20,label:'٤. الحل والنهاية',hint:'كيف انحلّت العقدة؟ وكيف تغيّرت الشخصية؟ أظهر العبرة ولا تكتبها.'}],
    model:'<b>رسالة من الماضي</b><br>لم يكن يتوقع أن يجد في الحقيبة القديمة ما يجعل قلبه يخفق هكذا. كان مازن يساعد أباه في ترتيب المخزن صباح الجمعة، حين لمح حقيبة جلدية بنية مغطاة بالغبار كأنها نُسيت هناك منذ قرون. فتحها، فوجد شهادة مدرسية قديمة باسم أبيه، فيها درجة «ضعيف» في الرياضيات! ابتسم مازن، ثم تذكّر شهادته هو التي أخفاها في درج مكتبه منذ أسبوع، وفيها الدرجة نفسها. تردد طويلًا: هل يخبر أباه؟ أم يخفي الأمر كما فعل؟ وفي المساء، دخل غرفة أبيه وفي يده الشهادتان، وقال بصوت خافت: «أبي... وجدت شهادتك، وهذه شهادتي». نظر الأب إليهما طويلًا، ثم ضحك ضحكة عالية، وقال: «وتعرف ماذا؟ أصبحت بعدها مهندسًا! تعال أعلمك الطريقة التي نجحت بها». ومنذ تلك الليلة، صار مازن وأبوه يجلسان كل خميس أمام مسائل الرياضيات، ولم يعد مازن يخفي شيئًا في درج مكتبه.'},
   {id:'truth',title:'لحظة صدق',kind:'موضوع',task:'اكتب قصة عن شخصية وقعت في موقف صعب، وكان عليها أن تختار بين الصدق والكذب.',

    fields:[{k:'title',label:'العنوان',ph:'عنوان قصير مشوّق'},
     {k:'start',ta:1,min:25,label:'١. البداية',hint:'جملة مشوّقة، ثم الشخصية والزمان والمكان.'},

     {k:'peak',ta:1,min:15,label:'٣. الذروة',hint:'لحظة الاختيار. أضف حوارًا ومشاعر.'},
     {k:'end',ta:1,min:20,label:'٤. الحل والنهاية',hint:'النتيجة، وكيف تغيّرت الشخصية.'}],
    model:'<b>الدرجة الكاملة</b><br>كانت الورقة على مكتب المعلمة، والفصل فارغ، ولا أحد يرى سلمى. في الفسحة عادت سلمى إلى الفصل لتأخذ زجاجة الماء، فوجدت ورقة إجابات امتحان العلوم مكشوفة على المكتب كأنها تناديها، وامتحانهم بعد الفسحة مباشرة. تسارعت دقات قلبها؛ فقد كانت تخاف من هذا الامتحان كثيرًا، وأمها وعدتها برحلة إن نجحت. مدّت يدها، ثم سحبتها، ثم مدّتها مرة أخرى. وفجأة دخلت المعلمة، فتجمدت سلمى في مكانها. قالت المعلمة بهدوء: «هل تحتاجين شيئًا يا سلمى؟». ترددت سلمى لحظة، ثم قالت بصوت مرتجف: «يا أستاذة، ورقة الإجابات كانت مكشوفة، ولم أنظر فيها... لكني كدت أفعل». سكتت المعلمة، ثم ابتسمت وقالت: «الشجاعة أن تقولي هذا». حصلت سلمى في الامتحان على درجة متوسطة، لكنها خرجت من الفصل مرفوعة الرأس، وكانت تلك أخف درجة حملتها في حياتها.'},
   {id:'train',title:'حوار في القطار',kind:'بداية بحوار',task:'ابدأ قصتك بحوار بين شخصين غريبين يلتقيان في القطار، ثم اجعل بينهما سرًّا أو مفاجأة.',

     {k:'peak',ta:1,min:15,label:'٣. الذروة',hint:'لحظة انكشاف المفاجأة.'},

    model:'<b>المقعد رقم ١٢</b><br>«عفوًا، أظنك تجلس في مقعدي». رفع الرجل العجوز عينيه عن كتابه، ونظر إلى يوسف مبتسمًا، ثم أشار إلى التذكرة: كان الرقم نفسه مكتوبًا في التذكرتين! جلس يوسف في المقعد المقابل، والقطار يغادر محطة القاهرة متجهًا إلى أسوان. لاحظ يوسف أن العجوز يقرأ كتابًا عن تاريخ النوبة، وعلى غلافه اسم مؤلف يعرفه جيدًا: إنه اسم جده الذي لم يره قط! قال يوسف بتردد: «هذا الكتاب... كتبه جدي، لكنه سافر قبل أن أولد». أغلق العجوز الكتاب ببطء، وامتلأت عيناه بالدموع، ثم قال: «وأنا كنت أعرف أن حفيدي اسمه يوسف». ظلا صامتين لحظات طويلة كأن الزمن توقف، لا يُسمع فيها إلا صوت عجلات القطار. وحين وصل القطار إلى أسوان، نزل يوسف ممسكًا بيد جده، وقد عرف أن بعض الأخطاء في التذاكر ليست أخطاء.'},
   {id:'adventure',title:'مغامرة في مكان غريب',kind:'موضوع',task:'اكتب قصة مغامرة تحدث في مكان غريب: كهف، أو جزيرة، أو مدينة تحت الماء، أو قصر مهجور.',
    tips:'صف المكان الغريب بالحواس · ماذا تبحث عنه الشخصية؟ · ما الخطر؟ · كيف تنجو بذكائها؟',
    fields:[{k:'title',label:'العنوان',ph:'عنوان قصير مشوّق'},

     {k:'end',ta:1,min:20,label:'٤. الحل والنهاية',hint:'كيف نجت بذكائها؟ وماذا تعلّمت؟'}],
    model:'<b>كهف الأصداء</b><br>كان الصوت يعود إلى ليلى من أعماق الكهف ثلاث مرات، كأن ثلاث ليلى يتحدثن معًا. دخلت ليلى الكهف خلف الجبل مع أخيها سامي، يبحثان عن الرسوم القديمة التي حكى عنها دليل الرحلة. كانت الجدران رطبة باردة، ورائحة التراب تملأ المكان، وضوء المصباح يرتعش على الصخور. وفجأة انطفأ المصباح، وغرق الكهف في ظلام حالك. صرخ سامي: «لن نخرج من هنا!». أمسكت ليلى يده، وحاولت أن تهدأ رغم أن قلبها يدق بقوة. ثم تذكّرت شيئًا: الصدى! قالت: «اسمع، حين نصرخ نحو المدخل يعود الصوت سريعًا وضعيفًا، لأنه قريب ومفتوح». أخذا يصفقان ويتبعان الصدى الأضعف خطوة خطوة، حتى لاح أمامهما خيط رفيع من الضوء. خرجا إلى الشمس وهما يضحكان ويبكيان معًا، وصارت ليلى منذ ذلك اليوم تحمل في حقيبتها مصباحين.'}],
  meters:(Tk,d,all)=>{const n=wc(all),fe=found(all,FEEL).length,dl=/«/.test(all),tc=found(all,TIMEC).length;
   return [{lbl:'طول القصة',val:AR(n),note:'المناسب ١٢٠ كلمة فأكثر',cls:n>=120?'good':n>=80?'warn':'bad'},
    {lbl:'المشاعر',val:AR(fe),note:'٣ أو أكثر',cls:fe>=3?'good':fe>=1?'warn':'bad'},
    {lbl:'أدوات الزمن',val:AR(tc),note:'٣ أو أكثر',cls:tc>=3?'good':tc>=2?'warn':'bad'},
    {lbl:'الحوار',val:dl?'موجود':'لا يوجد',note:'«...»',cls:dl?'good':'warn'}]},
  checks:(Tk,d,all)=>{const first=(d.start||'').split(/[.!؟?]/)[0]||'';const plain=found(first,PLAIN).length>0;
   const hook=!plain&&(/[«؟!?]/.test((d.start||'').slice(0,first.length+2))||wc(first)>=6);
   const cf=found(d.knot,CONFLICT).length>0,fe=found(all,FEEL).length,dl=/«/.test(all)&&/»/.test(all),pr=found(all,PREACH),n=wc(all),s=simile(all);
   const short=[['start',25,'١'],['knot',25,'٢'],['peak',15,'٣'],['end',20,'٤']].filter(([k,m])=>wc(d[k])<m).map(x=>x[2]);
   return [
    {ok:wc(d.title)>0&&wc(d.title)<=6,t:!wc(d.title)?'اكتب عنوانًا لقصتك.':wc(d.title)>6?'العنوان طويل؛ اجعله ست كلمات أو أقل.':'العنوان مناسب.'},
    {ok:hook,t:plain?'بدأت بـ«في يوم من الأيام». جرّب بداية أقوى: حوار، أو سؤال، أو لحظة من قلب المشكلة.':hook?'بداية قصتك تشد القارئ.':'اجعل الجملة الأولى أقوى: ابدأ بحوار، أو سؤال، أو لحظة مثيرة.'},
    {ok:cf,t:cf?'في العقدة صراع واضح.':'اجعل الصراع واضحًا في العقدة: ماذا تريد الشخصية؟ ولماذا لم تستطع؟ (لكن، حاول، خاف، تردد...)'},
    {ok:fe>=3,t:fe>=3?'عبّرت عن مشاعر الشخصيات.':'أظهر مشاعر الشخصيات أكثر: تسارعت دقات قلبه، تردد، ابتسم...'},
    {ok:dl,t:dl?'في القصة حوار.':'أضف سطر حوار واحدًا على الأقل في الذروة.'},
    {ok:!pr.length,t:pr.length?'كتبت العبرة كموعظة مباشرة («العبرة من...»). احذفها، وأظهرها بفعل الشخصية في النهاية.':'لم تكتب العبرة كموعظة مباشرة.'},
    {ok:s,t:s?'استخدمت تشبيهًا.':'أضف تشبيهًا واحدًا يقوّي الوصف.'},
    {ok:!short.length&&n>=115,t:short.length?`الجزء ${short.join(' و')} قصير. أضف تفاصيل.`:n>=115?`قصتك ${AR(n)} كلمة: طول مناسب.`:'أضف تفاصيل حتى تبلغ القصة ١٢٠ كلمة تقريبًا.'}]}}
 ]});
