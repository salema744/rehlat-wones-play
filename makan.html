 {id:'order',type:'order',t:'رتّب المشهد',d:'رتّب جمل الوصف لتنتقل بالقارئ في المكان خطوة خطوة.',hint:'تخيّل أنك تحمل كاميرا وتتحرك بها.',
  tasks:[
   {title:'بيت جدي: من الخارج إلى الداخل',items:['يقع بيت جدي في آخر الشارع، تحيط به أشجار النخيل.','وأمام الباب حديقة صغيرة تتوسطها نافورة قديمة.','وما إن تعبر الباب حتى تجد صالة واسعة مفروشة بالسجاد الأحمر.','وفي آخر الصالة غرفة جدي، وفيها مكتبته التي تفوح منها رائحة الكتب القديمة.'],why:'تحركنا من الخارج (الشارع) إلى الداخل (غرفة جدي)، كأننا نزور البيت فعلًا.'},
   {title:'من النافذة: من الأعلى إلى الأسفل',items:['في الأعلى، سماء صافية تتناثر فيها سحب بيضاء صغيرة.','وتحتها تمتد الجبال البعيدة بلونها البنفسجي.','وعلى سفح الجبل قرية صغيرة بيوتها بيضاء.','وعند قدميّ يجري جدول ماء صافٍ بين الحصى.'],why:'من الأعلى إلى الأسفل، ومن البعيد إلى القريب.'},
   {title:'الفصل: من المدخل إلى آخره',items:['عند باب الفصل علّقنا لوحة كبيرة بأسماء التلاميذ.','وأمامنا السبورة البيضاء، وبجانبها مكتب المعلمة.','وفي الوسط تصطف المقاعد الخشبية في أربعة صفوف.','وفي آخر الفصل ركن القراءة بوسائده الملونة ورفوفه الصغيرة.'],why:'من المدخل، إلى الأمام، إلى الوسط، إلى آخر الفصل.'}]},

    {t:'تتراقص الفراشات الملونة بين الأزهار، وتنتشر في الهواء رائحة الورد المبلل بندى الصباح.',ok:1,why:'حركة وألوان ورائحة.'},{t:'في الحديقة أشجار وورد وفراشات ومقعد.',ok:0,why:'قائمة جافة.'},{t:'الحديقة مكان للعب.',ok:0,why:'تعريف لا وصف.'},{t:'الحديقة مظلمة مخيفة.',ok:0,why:'تناقض الصورة المشرقة.'}]},

 {id:'intruder',type:'tap',t:'الجملة الدخيلة',d:'اكتشف الجملة التي خرجت عن وصف المكان أو ناقضته.',prompt:'اضغط على الجملة أو الجمل التي لا تناسب الوصف، ثم «تحقّق».',
  tasks:[
   {title:'مكتبة المدرسة',sents:['تقع مكتبة مدرستنا في الطابق الثاني، في الجناح الهادئ البعيد عن الملاعب.','وتغطي جدرانها رفوف خشبية عالية مليئة بالكتب الملونة.','ويدخلها ضوء الشمس من نوافذ واسعة تطل على الحديقة.','ولاعبو فريق الكرة في مدرستنا ماهرون.','ويسود المكان هدوء جميل لا يقطعه إلا صوت تقليب الصفحات.'],bad:[3],why:'مهارة لاعبي الكرة لا علاقة لها بوصف المكتبة.'},
   {title:'حديقة في الشتاء',sents:['في صباح شتوي بارد، بدت الحديقة هادئة خالية من الزوار.','تساقطت أوراق الأشجار فغطت الممرات ببساط بني.','والأطفال يسبحون في البحيرة هربًا من الحر الشديد.','وتجمعت قطرات المطر على المقاعد الخشبية الباردة.'],bad:[2],why:'السباحة هربًا من الحر تناقض صباح الشتاء البارد.'},
   {title:'المطبخ صباح العيد',sents:['يمتلئ مطبخنا صباح العيد بالحركة والدفء.','تفوح منه رائحة الكعك الساخن والسمن البلدي.','وتتعالى ضحكات خالاتي وهن يزيّنّ الكعك بالسكر الأبيض.','والعيد مناسبة يحتفل بها المسلمون في أنحاء العالم.','وعلى الطاولة تصطف صواني الكعك في صفوف مرتبة كأنها جنود صغار.','والمطبخ صامت حزين لا حركة فيه.'],bad:[3,5],why:'الجملة عن العيد معلومة عامة لا تصف المطبخ، والصمت والحزن يناقضان الحركة والضحكات.'}]},

     {k:'senses',ta:1,min:25,label:'٣. ماذا أسمع وأشم وألمس وأتذوق؟',hint:'استخدم ثلاث حواس على الأقل غير البصر.'},
     {k:'feel',ta:1,min:15,label:'٤. بماذا أشعر؟',hint:'ما شعورك في هذا المكان؟ ولماذا تحبه؟'}],
    model:'أحب مكان في بيتنا هو الشرفة الصغيرة المطلة على الشارع، وأجلس فيها كل مساء بعد أن أنهي واجباتي. في ركنها الأيمن تقف أصص الريحان والنعناع في صف أخضر مرتب، وفي وسطها كرسيان من الخيزران بينهما طاولة صغيرة مستديرة. ومن فوق السور أرى الشارع ممتدًا تحت أضواء المساء الصفراء كأنه نهر من الضوء. أسمع ضحكات الأطفال يلعبون في الأسفل، وصوت بائع الذرة ينادي على بضاعته، وتفوح من الأصص رائحة النعناع المنعشة. وحين يهب النسيم البارد على وجهي، وأرشف كوب الشاي بالنعناع الدافئ الحلو، أشعر براحة لا أجدها في أي مكان آخر. الشرفة عالمي الصغير الذي أحكي له أسراري.'},
   {id:'market',title:'سوق مزدحم',kind:'وصف حقيقي',task:'صِف سوقًا مزدحمًا زرته: سوق خضار، أو سوق سمك، أو مركزًا تجاريًا.',
    tips:'ابدأ من المدخل · صف ألوان البضائع · ماذا ينادي الباعة؟ · ما الروائح المختلطة؟',
    fields:[{k:'intro',ta:1,min:15,label:'١. أين ومتى؟',hint:'أين السوق؟ ومتى يزدحم؟'},
     {k:'see',ta:1,min:25,label:'٢. ماذا أرى؟',hint:'من المدخل إلى الداخل، مع الألوان وتشبيه.'},
     {k:'senses',ta:1,min:25,label:'٣. ماذا أسمع وأشم وألمس وأتذوق؟',hint:'نداءات الباعة، والروائح، والزحام.'},
     {k:'feel',ta:1,min:15,label:'٤. بماذا أشعر؟',hint:'ما شعورك وسط هذا الزحام؟'}],
    model:'يقع سوق السمك على شاطئ مدينتنا، ويبلغ زحامه ذروته في الصباح الباكر حين تعود قوارب الصيادين. عند المدخل تصطف الطاولات الخشبية الطويلة، وفوقها أكوام من الأسماك الفضية تلمع كأنها قطع من المرايا. وإلى اليسار أحواض كبيرة تتحرك فيها الكابوريا بأرجلها الكثيرة. تتعالى أصوات الباعة وهم ينادون: «سمك طازج!»، وتصيح النوارس فوق القوارب الراسية. وتملأ المكان رائحة البحر المالحة، ورائحة السمك المشوي من مطعم صغير في آخر السوق. الأرض مبتلة باردة تحت قدميّ، ونسيم البحر يلسع وجهي. ورغم الزحام والضوضاء، أشعر في هذا السوق بالحياة تنبض في كل زاوية.'},
   {id:'beach',title:'شاطئ البحر',kind:'وصف حقيقي',task:'صِف شاطئ بحر زرته أو تتخيله.',
    tips:'من البعيد (الأفق) إلى القريب (قدميك) · لون الماء والرمل · صوت الموج · طعم الماء المالح.',
    fields:[{k:'intro',ta:1,min:15,label:'١. أين ومتى؟',hint:'أي شاطئ؟ ومتى زرته؟'},
     {k:'see',ta:1,min:25,label:'٢. ماذا أرى؟',hint:'من الأفق البعيد إلى الرمال عند قدميك، مع تشبيه.'},
     {k:'senses',ta:1,min:25,label:'٣. ماذا أسمع وأشم وألمس وأتذوق؟',hint:'الموج، والنوارس، والرمل، والماء المالح.'},
     {k:'feel',ta:1,min:15,label:'٤. بماذا أشعر؟',hint:'ماذا يحدث في نفسك أمام البحر؟'}],
    model:'شاطئ العجمي من أجمل الأماكن التي زرتها، وأقصده مع أسرتي كل صيف في الصباح الباكر قبل أن يزدحم. على مد البصر يمتد البحر الأزرق حتى يلتقي بالسماء عند الأفق، وتتهادى فوقه قوارب صغيرة كأنها أوراق تطفو على الماء. وأمامي تتكسر الأمواج البيضاء على الرمال الذهبية، ثم تنسحب في هدوء. أسمع هدير الموج المتواصل، وصيحات الأطفال وهم يبنون قلاعًا من الرمل، وتداعب أنفي رائحة البحر المالحة. أغوص بقدميّ في الرمل الدافئ الناعم، وأتذوق ملوحة الماء على شفتيّ بعد السباحة. أشعر على هذا الشاطئ بأن صدري يتسع، وأن همومي تذوب مع الموج.'},
   {id:'school',title:'مدرستي في الصباح',kind:'وصف حقيقي',task:'صِف مدرستك في الصباح الباكر قبل بدء اليوم الدراسي.',
    tips:'من البوابة إلى الفناء إلى الفصل · أصوات الصباح · رائحة المقصف · شعورك عند الوصول.',
    fields:[{k:'intro',ta:1,min:15,label:'١. أين ومتى؟',hint:'أين تقع مدرستك؟ وما الوقت؟'},
     {k:'see',ta:1,min:25,label:'٢. ماذا أرى؟',hint:'من البوابة إلى الداخل، مع الألوان وتشبيه.'},
     {k:'senses',ta:1,min:25,label:'٣. ماذا أسمع وأشم وألمس وأتذوق؟',hint:'الجرس، والضحكات، والهواء، والروائح.'},
     {k:'feel',ta:1,min:15,label:'٤. بماذا أشعر؟',hint:'ما شعورك حين تصل إلى المدرسة؟'}],
    model:'مدرستي مبنى من ثلاثة طوابق يطل على حديقة واسعة في أول شارع النصر، وأجمل أوقاتها عندي الصباح الباكر قبل طابور الصباح. حين أعبر البوابة الحديدية الخضراء أرى الفناء الواسع، تحيط به أشجار الكافور العالية، وفي وسطه سارية يرفرف فوقها العلم. وعلى الجدران رسومات ملونة رسمها التلاميذ، كأنها نوافذ مفتوحة على عالم من الخيال. أسمع وقع أقدام التلاميذ وضحكاتهم، وصوت الجرس يدق معلنًا بدء الطابور. وتفوح من المقصف رائحة الفطائر الساخنة، ويلسع هواء الصباح البارد وجهي. أحب مدرستي في الصباح؛ فهي تستقبلني كل يوم كأنها بيتي الثاني.'}],
  meters:(Tk,d,all)=>{const se=sensesIn(all),sp=found(all,SPACE).length,s=simile(all),n=wc(all);
   return [{lbl:'طول الوصف',val:AR(n),note:'المناسب ١٠٠ كلمة فأكثر',cls:n>=100?'good':n>=60?'warn':'bad'},
    {lbl:'الحواس',val:AR(se.length)+' / ٥',note:se.length?se.join('، '):'استخدم ٤ حواس',cls:se.length>=4?'good':se.length>=3?'warn':'bad'},
    {lbl:'كلمات المكان',val:AR(sp),note:'أمام، يمين، فوق، في الوسط...',cls:sp>=3?'good':sp>=2?'warn':'bad'},
    {lbl:'التشبيه',val:s?'موجود':'لا يوجد',note:'كأنّ، مثل، كالـ...',cls:s?'good':'warn'}]},
  checks:(Tk,d,all)=>{const se=sensesIn(all),sp=found(all,SPACE),s=simile(all),fe=found(all,FEELP).length>0,n=wc(all);
   const miss=Object.keys(SENSES).filter(k=>!se.includes(k));
   const short=[['intro',15,'١'],['see',25,'٢'],['senses',25,'٣'],['feel',15,'٤']].filter(([k,m])=>wc(d[k])<m).map(x=>x[2]);
   const jdan=(all.match(/جدًا|جدا|جدًّا/g)||[]).length;
   return [
    {ok:wc(d.intro)>=15,t:wc(d.intro)>=15?'حدّدت المكان والزمان في البداية.':'ابدأ بتحديد المكان: أين يقع؟ ومتى تصفه؟'},
    {ok:se.includes('البصر'),t:se.includes('البصر')?'وصفت ما تراه بالألوان والأشكال.':'صف ما تراه: الألوان، والأشكال، والضوء.'},
    {ok:se.length>=4,t:se.length>=4?`استخدمت ${AR(se.length)} حواس: ${se.join('، ')}.`:`استخدمت ${AR(se.length)} حواس فقط. أضف: ${miss.join('، ')}.`},
    {ok:sp.length>=3,t:sp.length>=3?'رتّبت الوصف بكلمات المكان.':'رتّب الوصف بكلمات المكان: أمام، خلف، يمين، يسار، فوق، في الوسط، في الركن.'},
    {ok:s,t:s?'استخدمت تشبيهًا.':'أضف تشبيهًا: «تتلألأ الأضواء كأنها نجوم».'},
    {ok:fe,t:fe?'عبّرت عن مشاعرك في المكان.':'اختم بشعورك: أشعر بالراحة، أحب هذا المكان لأن...'},
    {ok:jdan<=2,t:jdan<=2?'لم تُكثر من كلمة «جدًا».':`كررت «جدًا» ${AR(jdan)} مرات. استبدلها بصفة أدق.`},
    {ok:!short.length&&n>=100,t:short.length?`الجزء ${short.join(' و')} قصير. أضف تفاصيل.`:n>=100?'طول الوصف مناسب.':'أضف تفاصيل حتى يبلغ الوصف ١٠٠ كلمة.'}]}}
 ]});
