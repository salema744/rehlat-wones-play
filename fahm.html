<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فهم المقروء</title>
<script data-goatcounter="https://rehlatwones.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}
/* Layout: reading page on top, one question card at a time below it, skill report at the end */
:root{
  --bg:#FBF8F1; --surface:#FFFFFF; --ink:#2A2A1C; --muted:#6B6A52; --line:#E3DECB;
  --olive:#64663A; --olive-soft:#ECEDDC; --terra:#C97735; --terra-soft:#F8E7D6;
  --plum:#7A5480; --plum-soft:#F1E6F2; --sea:#2F6F7E; --sea-soft:#E0EEF1;
  --ok:#3B7A4C; --ok-soft:#E1F0E3; --err:#B4452F; --err-soft:#F7E0DA; --hl:#F5DC86; --on:#FFFFFF;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-read:"Noto Naskh Arabic","Traditional Arabic","Times New Roman",serif;
  --f-ui:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1B13; --surface:#24251B; --ink:#EEEBDC; --muted:#AAA88E; --line:#393A2B;
  --olive:#AEB274; --olive-soft:#31331F; --terra:#E4975E; --terra-soft:#3D2A1A;
  --plum:#C9A3CF; --plum-soft:#352838; --sea:#7FC0CF; --sea-soft:#1D3237;
  --ok:#80C492; --ok-soft:#1E3224; --err:#EE8B76; --err-soft:#3D221C; --hl:#6A5A1C; --on:#1A1B13; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1B13; --surface:#24251B; --ink:#EEEBDC; --muted:#AAA88E; --line:#393A2B;
  --olive:#AEB274; --olive-soft:#31331F; --terra:#E4975E; --terra-soft:#3D2A1A;
  --plum:#C9A3CF; --plum-soft:#352838; --sea:#7FC0CF; --sea-soft:#1D3237;
  --ok:#80C492; --ok-soft:#1E3224; --err:#EE8B76; --err-soft:#3D221C; --hl:#6A5A1C; --on:#1A1B13; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:1.6rem;color:var(--olive)} h2{font-size:1.15rem}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--olive);font-weight:500;text-decoration:none;align-self:flex-start}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.student{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.field{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px}
.btn.primary{background:var(--olive);border-color:var(--olive);color:var(--on);font-weight:600}
.btn.small{padding:4px 9px;font-size:.85rem}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.lv{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-weight:500}
.lv[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.texts{display:flex;gap:8px;flex-wrap:wrap}
.tcard{text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;display:flex;flex-direction:column;gap:2px}
.tcard b{font-family:var(--f-read);font-weight:600;font-size:1rem}
.tcard span{color:var(--muted);font-size:.8rem}
.tcard[aria-pressed="true"]{border-color:var(--olive);box-shadow:inset 0 0 0 1px var(--olive);background:var(--olive-soft)}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.chk{display:inline-flex;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px}
.page{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px clamp(14px,4vw,34px) 24px}
.page h2{font-family:var(--f-read);font-size:1.45rem;margin-bottom:10px;color:var(--olive)}
.reading{font-family:var(--f-read);line-height:2.2}
.reading p{margin:0 0 .7em}
.reading p:last-child{margin-bottom:0}
.ev{background:var(--hl);border-radius:5px;box-shadow:0 0 0 2px var(--hl)}
.page.collapsed .reading{display:none}
.hiddenNote{color:var(--muted);margin:0;font-size:.9rem}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:600}
.k-d{background:var(--olive-soft);color:var(--olive)} .k-i{background:var(--terra-soft);color:var(--terra)}
.k-v{background:var(--plum-soft);color:var(--plum)} .k-m{background:var(--sea-soft);color:var(--sea)} .k-o{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.dots{display:flex;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.cur{background:var(--ink)} .dot.ok{background:var(--ok)} .dot.bad{background:var(--err)} .dot.op{background:var(--muted)}
.qtext{font-family:var(--f-read);font-size:1.3rem;line-height:1.9;margin:0}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:right;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;font-family:var(--f-read);font-size:1.12rem;line-height:1.7;display:flex;gap:10px;align-items:flex-start}
.choice .let{font-family:var(--f-ui);font-weight:600;color:var(--muted);min-width:1.4em}
.choice:hover:not(:disabled){border-color:var(--olive)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--err);background:var(--err-soft)}
.choice:disabled{cursor:default}
.fb{border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--err-soft)} .fb.op{background:var(--bg);border:1px solid var(--line)}
.fb b{font-size:1rem} .fb.ok b{color:var(--ok)} .fb.bad b{color:var(--err)}
.fb p{margin:0;font-family:var(--f-read);font-size:1.05rem;line-height:1.8}
.quote{font-family:var(--f-read);border-inline-start:3px solid var(--hl);padding-inline-start:10px;color:var(--ink)}
textarea.field{min-height:110px;font-family:var(--f-read);font-size:1.08rem;line-height:1.9;width:100%;box-sizing:border-box}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.result{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.big{font-family:var(--f-display);font-size:2.2rem;color:var(--olive);line-height:1}
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.skills{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sk{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.sk span{font-size:.82rem;color:var(--muted)}
.sk b{font-variant-numeric:tabular-nums;font-size:1.15rem}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.progress{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;white-space:nowrap}
.x{border:0;background:transparent;color:var(--muted);font-size:1rem;padding:2px 6px}
details.ans summary{cursor:pointer;color:var(--olive)}
details.ans p{margin:.3em 0;font-family:var(--f-read)}
.note{font-size:.85rem;color:var(--muted);margin:0}
.empty{color:var(--muted);margin:0}
.credit{text-align:center;color:var(--muted);font-size:.78rem;margin-top:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap" lang="ar">
  <a class="back" href="./">→ الرئيسية</a>
  <header class="top">
    <div>
      <h1>فهم المقروء</h1>
      <p class="sub">اقرأ النص جيدًا، ثم أجب عن الأسئلة. بعد كل إجابة سيظهر لك الدليل في النص.</p>
    </div>
    <div class="student" id="studentBox"></div>
  </header>

  <nav class="levels" id="levels" aria-label="المستويات"></nav>
  <div class="texts" id="texts"></div>

  <div class="opts">
    <label class="chk"><input type="checkbox" id="tashk" checked> إظهار التشكيل</label>
    <label class="chk"><input type="checkbox" id="hideTxt"> إخفاء النص أثناء الإجابة (تحدٍّ)</label>
    <div class="seg" role="group" aria-label="حجم الخط">
      <button id="fMinus" aria-label="تصغير الخط">ا−</button>
      <button id="fPlus" aria-label="تكبير الخط">ا+</button>
    </div>
  </div>

  <article class="page" id="page">
    <h2 id="tTitle"></h2>
    <div class="reading" id="reading"></div>
    <p class="hiddenNote" id="hiddenNote" hidden>النص مخفي الآن. أجب من ذاكرتك، أو أوقف خيار «إخفاء النص» لتراه من جديد.</p>
  </article>

  <section class="qcard" id="qcard"></section>
  <section class="result" id="result" hidden></section>

  <section class="progress">
    <h2>تقرير المهارات</h2>
    <div id="progress"></div>
  </section>

  <p class="credit">إعداد: رحلة ونس - أ. سالمة سيد</p>
</div>
<script>

  document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{ui.level=+b.dataset.l;ui.tid=DATA.find(t=>t.level===ui.level).id;saveUi();newQuiz();renderAll()});
  $('texts').innerHTML=DATA.filter(t=>t.level===ui.level).map(t=>{const h=S.hist.filter(x=>x.student===S.current&&x.tid===t.id);const best=h.length?Math.max(...h.map(x=>x.score)):null;
    return `<button class="tcard" data-id="${t.id}" aria-pressed="${t.id===ui.tid}"><b>${esc(tx(t.title))}</b><span>${n(t.p.join(' ').split(/\s+/).length)} كلمة${best!==null?` · أفضل نتيجة ${n(best)}/${n(h[0].total)}`:''}</span></button>`}).join('');
  document.querySelectorAll('.tcard').forEach(b=>b.onclick=()=>{ui.tid=b.dataset.id;saveUi();newQuiz();renderAll()});
}
let EV=null;
function renderText(){
  const t=cur();$('tTitle').textContent=tx(t.title);
  const r=$('reading');r.style.fontSize=ui.size+'px';
  let k=0;r.innerHTML=t.p.map(p=>'<p>'+p.split(/\s+/).map(w=>`<span data-k="${k++}">${esc(tx(w))}</span>`).join(' ')+'</p>').join('');
  const hide=ui.hide&&Q&&Q.started&&!Q.done;
  $('page').classList.toggle('collapsed',hide);$('hiddenNote').hidden=!hide;
  if(EV)markEv(EV,false);
}
function findEv(ev){
  const toks=cur().p.join(' ').split(/\s+/).map(norm);const e=ev.split(/\s+/).map(norm).filter(Boolean);
  for(let i=0;i+e.length<=toks.length;i++){let ok=true;for(let j=0;j<e.length;j++)if(toks[i+j]!==e[j]){ok=false;break}if(ok)return [i,i+e.length-1]}
  return null;
}
function markEv(ev,scroll){
  document.querySelectorAll('#reading .ev').forEach(s=>s.classList.remove('ev'));
  EV=ev;if(!ev)return;const r=findEv(ev);if(!r)return;
  for(let k=r[0];k<=r[1];k++){const s=document.querySelector(`#reading span[data-k="${k}"]`);if(s)s.classList.add('ev')}
  if(scroll&&!$('page').classList.contains('collapsed')){const s=document.querySelector('#reading .ev');if(s&&s.getBoundingClientRect().top<0)s.scrollIntoView({behavior:'smooth',block:'center'})}
}
function renderQ(){
  const box=$('qcard');
  if(!Q||Q.tid!==cur().id)newQuiz();
  if(!Q.started){
    box.hidden=false;
    box.innerHTML=`<h2>الأسئلة (${n(Q.items.length)})</h2>
     <p class="note">في الأسئلة: ${['d','i','v','m','o'].filter(k=>Q.items.some(q=>q.t===k)).map(k=>`<span class="chip k-${k}">${SK[k]}</span>`).join(' ')}</p>
     <div class="row"><button class="btn primary" id="startQ">قرأتُ النص، ابدأ الأسئلة</button></div>`;
    $('startQ').onclick=()=>{Q.started=true;renderText();renderQ();box.scrollIntoView({behavior:'smooth',block:'start'})};return;
  }
  if(Q.done){box.hidden=true;return}
  box.hidden=false;
  const q=Q.items[Q.i];const answered=q.ans!==null;
  const dots=Q.items.map((x,k)=>{let c='dot';if(k===Q.i)c+=' cur';else if(x.ans!==null)c+=x.t==='o'?' op':(x.ans===0?' ok':' bad');return `<span class="${c}"></span>`}).join('');
  let body='';
  if(q.t==='o'){
    body=`<textarea class="field" id="openA" placeholder="اكتب إجابتك هنا…" ${answered?'readonly':''}>${esc(q.ans||'')}</textarea>
     ${answered?`<div class="fb op"><b>أفكار تساعدك على مراجعة إجابتك</b><p>${esc(tx(q.h))}</p><p class="note">هذا سؤال رأي، لا توجد إجابة واحدة صحيحة. المهم أن تذكر سببًا واضحًا.</p></div>`:`<div class="row"><button class="btn primary" id="openOk">تم</button></div>`}`;
  }else{
    body=`<div class="choices">${q.order.map((oi,pos)=>{let c='choice';if(answered){if(oi===0)c+=' right';else if(oi===q.ans)c+=' wrong'}
      return `<button class="${c}" data-oi="${oi}" ${answered?'disabled':''}><span class="let">${LET[pos]}</span><span>${esc(tx(q.o[oi]))}</span></button>`}).join('')}</div>`;
    if(answered){const ok=q.ans===0;const ev=q.ev?findEv(q.ev):null;
      body+=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'إجابة صحيحة ✓':'إجابة غير صحيحة ✗'}</b>${ok?'':`<p>الإجابة الصحيحة: ${esc(tx(q.o[0]))}</p>`}<p>${esc(tx(q.e))}</p>
        ${q.ev?(ui.hide?`<p class="quote">من النص: «${esc(tx(q.ev))}»</p>`:`<p class="note">الدليل ملوّن في النص بالأصفر.</p>`):''}</div>`}
  }
  const last=Q.i===Q.items.length-1;
  box.innerHTML=`<div class="qhead"><span class="chip k-${q.t}">${SK[q.t]}</span><div class="dots" aria-label="السؤال ${n(Q.i+1)} من ${n(Q.items.length)}">${dots}</div></div>
    <p class="qtext"><span class="note">${n(Q.i+1)}.</span> ${esc(tx(q.q))}</p>${body}
    ${answered?`<div class="row"><button class="btn primary" id="nextQ">${last?'اعرض النتيجة':'السؤال التالي'}</button></div>`:''}`;
  box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{q.ans=+b.dataset.oi;markEv(q.ev,true);renderQ()});
  if($('openOk'))$('openOk').onclick=()=>{const v=$('openA').value.trim();if(!v){$('openA').focus();return}q.ans=v;renderQ()};
  if($('nextQ'))$('nextQ').onclick=()=>{markEv(null);if(last){Q.done=true;finish()}else{Q.i++;renderQ()}};
}
function scoreOf(){
  const sk={};let s=0,t=0;Q.items.forEach(q=>{if(q.t==='o')return;t++;const ok=q.ans===0;if(ok)s++;sk[q.t]=sk[q.t]||[0,0];sk[q.t][1]++;if(ok)sk[q.t][0]++});
  return {score:s,total:t,sk,open:Q.items.filter(q=>q.t==='o').map(q=>({q:q.q,a:q.ans}))};
}
function finish(){
  const r=scoreOf();
  if(S.current&&!Q.saved){S.hist.push({id:Date.now(),student:S.current,tid:Q.tid,date:Date.now(),...r});Q.saved=true;save()}
  renderAll();$('result').scrollIntoView({behavior:'smooth',block:'start'});
}
function skillTiles(sk){
  return ['d','i','v','m'].filter(k=>sk[k]).map(k=>{const [a,b]=sk[k];const p=b?Math.round(a/b*100):0;
    return `<div class="sk"><span>${SK[k]}</span><b>${n(a)} / ${n(b)}</b><div class="bar"><i style="width:${p}%;background:${SKC[k]}"></i></div></div>`}).join('');
}
function renderResult(){
  const box=$('result');if(!Q||!Q.done){box.hidden=true;return}
  box.hidden=false;const r=scoreOf();const pct=r.total?r.score/r.total:0;
  const weak=['d','i','v','m'].filter(k=>r.sk[k]&&r.sk[k][0]<r.sk[k][1]);
  const lv=DATA.filter(t=>t.level===ui.level);const nxt=DATA[DATA.indexOf(cur())+1];
  box.innerHTML=`<h2>النتيجة</h2>
    <div class="row"><span class="big">${n(r.score)} / ${n(r.total)}</span><span>${pct===1?'ممتاز! فهمت النص فهمًا كاملًا 🎉':pct>=.6?'أحسنت! فهمك جيد، وراجع ما أخطأت فيه.':'نحتاج قراءة النص مرة أخرى بتمهّل، ثم نعيد المحاولة.'}</span></div>
    <div class="skills">${skillTiles(r.sk)}</div>
    ${weak.length?`<p class="note">مهارات تحتاج تدريبًا في هذا النص: ${weak.map(k=>`<span class="chip k-${k}">${SK[k]}</span>`).join(' ')}</p>`:''}
    ${r.open.length?`<div class="fb op"><b>إجابتك عن سؤال الرأي</b>${r.open.map(o=>`<p>${esc(o.a||'')}</p>`).join('')}</div>`:''}
    ${S.current?'':'<p class="note">أضف اسم الطالب من فوق لتُحفظ النتائج.</p>'}
    <div class="row"><button class="btn" id="again">أعد المحاولة</button>${nxt?`<button class="btn primary" id="nextT">النص التالي ←</button>`:''}</div>`;
  $('again').onclick=()=>{newQuiz();renderAll();$('page').scrollIntoView({behavior:'smooth'})};
  if($('nextT'))$('nextT').onclick=()=>{ui.tid=nxt.id;ui.level=nxt.level;saveUi();newQuiz();renderAll();window.scrollTo({top:0,behavior:'smooth'})};
}
function renderProgress(){
  const box=$('progress');
  if(!S.current){box.innerHTML='<p class="empty">أضف طالبًا لتظهر نتائجه هنا.</p>';return}
  const h=S.hist.filter(x=>x.student===S.current).sort((a,b)=>b.date-a.date);
  if(!h.length){box.innerHTML=`<p class="empty">لا توجد نتائج محفوظة لـ «${esc(S.current)}» بعد. اختر نصًّا وأجب عن أسئلته.</p>`;return}
  const tot={};h.forEach(x=>Object.entries(x.sk).forEach(([k,[a,b]])=>{tot[k]=tot[k]||[0,0];tot[k][0]+=a;tot[k][1]+=b}));
  const ranked=['d','i','v','m'].filter(k=>tot[k]).sort((a,b)=>tot[a][0]/tot[a][1]-tot[b][0]/tot[b][1]);
  const weakest=ranked[0]&&tot[ranked[0]][0]/tot[ranked[0]][1]<.75?ranked[0]:null;
  box.innerHTML=`<p class="note">مجموع كل المحاولات${S.current==='مثال'?' (بيانات مثال)':''}</p>
    <div class="skills">${skillTiles(tot)}</div>
    ${weakest?`<p class="note">أكثر مهارة تحتاج تدريبًا: <span class="chip k-${weakest}">${SK[weakest]}</span></p>`:''}
    <div class="tbl"><table><thead><tr><th>التاريخ</th><th>النص</th><th>المستوى</th><th>النتيجة</th><th>سؤال الرأي</th><th></th></tr></thead><tbody>
    ${h.map(x=>{const t=DATA.find(d=>d.id===x.tid);return `<tr><td>${new Date(x.date).toLocaleDateString('ar-EG',{day:'numeric',month:'short'})}</td><td>${t?esc(strip(t.title)):''}</td><td>${t?n(t.level):''}</td><td><b>${n(x.score)}/${n(x.total)}</b></td>
      <td>${x.open&&x.open.length&&x.open[0].a?`<details class="ans"><summary>اعرض</summary>${x.open.map(o=>`<p>${esc(o.a)}</p>`).join('')}</details>`:'—'}</td><td><button class="x" data-del="${x.id}" aria-label="حذف">×</button></td></tr>`}).join('')}
    </tbody></table></div>`;
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.hist=S.hist.filter(x=>String(x.id)!==b.dataset.del);save();renderProgress();renderLevels()});
}
function renderAll(){renderStudents();renderLevels();renderText();renderQ();renderResult();renderProgress()}
$('tashk').checked=ui.tashk;$('hideTxt').checked=ui.hide;
$('tashk').onchange=e=>{ui.tashk=e.target.checked;saveUi();renderAll()};
$('hideTxt').onchange=e=>{ui.hide=e.target.checked;saveUi();renderText();renderQ()};
$('fMinus').onclick=()=>{ui.size=Math.max(16,ui.size-2);saveUi();renderText()};
$('fPlus').onclick=()=>{ui.size=Math.min(40,ui.size+2);saveUi();renderText()};
newQuiz();renderAll();
</script>
</body>
</html>
