 {id:'guide',type:'guide',t:'تشريح فقرة الرأي',d:'اقرأ فقرة رأي عن الزي المدرسي، وشاهد كيف بُنيت.',

 {id:'order',type:'order',t:'رتّب فقرة الرأي',d:'رتّب الجمل لتبني فقرة رأي متماسكة.',hint:'الرأي أولًا، ثم الأسباب، ثم الرأي الآخر والرد، ثم الخاتمة.',
  tasks:[
   {title:'الواجبات المنزلية',items:['أرى أن الواجبات المنزلية القصيرة ضرورية للطالب.','فهي تساعده على تثبيت ما تعلّمه في الفصل.','كما تعوّده على تنظيم وقته وتحمّل المسؤولية.','قد يرى بعضهم أنها تحرمه من اللعب، لكنّ الواجب القصير لا يأخذ إلا وقتًا يسيرًا.','لذلك أؤيد الواجبات، بشرط أن تكون قصيرة ومفيدة.'],why:'رأي ← سبب ← سبب ← رأي آخر ورد ← خاتمة.'},
   {title:'الهاتف للأطفال',items:['لا أؤيد أن يمتلك الأطفال دون العاشرة هواتف خاصة بهم.','فالهاتف قد يعرّضهم لمحتوى لا يناسب أعمارهم.','فضلًا عن أنه يقلل من وقت لعبهم وحركتهم.','صحيح أن الهاتف يساعد الأهل على الاطمئنان على أبنائهم، لكن يمكن تحقيق ذلك بهاتف الأسرة.','لذا أرى أن ننتظر حتى يكبر الطفل ويتعلم الاستخدام المسؤول.'],why:'«فضلًا عن» تأتي بعد سبب أول، و«صحيح أن... لكن» تعرض الرأي الآخر وترد عليه، و«لذا» للخاتمة.'}]},

 {id:'weak',type:'tap',t:'الحجة الضعيفة',d:'اكتشف الجمل التي تُضعف فقرة الرأي.',prompt:'اضغط على الجمل التي تُضعف الفقرة، ثم «تحقّق».',keepOrder:true,

   {title:'رحلة المتحف',sents:['أرى أن تكون رحلة هذا العام إلى المتحف.','فالمتحف يعرّفنا بتاريخ بلادنا بطريقة ممتعة.','وكل التلاميذ في العالم يحبون المتاحف.','كما أن تذكرة المتحف للطلاب رخيصة.','وأنا اشتريت حذاءً جديدًا الأسبوع الماضي.','لذلك أقترح أن نصوّت للمتحف.'],bad:[2,4],fix:{2:'وقد استمتع كثير منا بزيارة المتحف في العام الماضي.',4:''},why:'«كل التلاميذ في العالم» تعميم بلا دليل، وجملة الحذاء لا علاقة لها بالموضوع.'},
